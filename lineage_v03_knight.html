<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>類天堂 V0.3 騎士戰鬥測試</title><style>*{box-sizing:border-box}body{margin:0;background:#101714;color:#e8e4cd;font:14px system-ui}header{padding:8px 12px;background:#25382b;display:flex;justify-content:space-between}#world{display:block;width:100%;height:min(59vh,580px);touch-action:none;background:#344333}#hud{padding:7px 10px;background:#202d23;display:flex;gap:12px;flex-wrap:wrap}.panel{padding:8px;display:flex;gap:7px;flex-wrap:wrap;align-items:center}button,select,input{background:#344d3a;color:#fff;border:1px solid #78917a;border-radius:6px;padding:9px;font-size:14px}button:active{background:#738b58}#log{height:110px;overflow:auto;background:#101714;padding:6px 10px;font:12px monospace}small{color:#b7c2a9}#pad{display:grid;grid-template-columns:repeat(3,48px);gap:2px}#pad button{height:38px;padding:0}.selected{outline:2px solid #e9c865}</style><header><b>類天堂 V0.3｜騎士戰鬥實驗室</b><small>測試參數・非原版實測值</small></header><div id="hud"><span id="hp"></span><span id="info"></span><span id="target"></span></div><canvas id="world"></canvas><div class="panel"><label>AC <select id="ac"><option value="0">0</option><option value="-20">-20</option><option value="-40" selected>-40</option><option value="-60">-60</option></select></label><button id="attack">⚔️ 自動攻擊：關</button><button id="pot">🧪 紅水</button><label><input type="checkbox" id="auto" checked>自動紅水</label><label>門檻 <input type="range" id="threshold" min="10" max="90" value="50" step="10"><span id="pct">50%</span></label><button id="reset">重置</button></div><div class="panel"><div id="pad"><span></span><button data-dir="0,-1">▲</button><span></span><button data-dir="-1,0">◀</button><button data-dir="0,1">▼</button><button data-dir="1,0">▶</button></div><small>點地面移動／方向鍵移動；點怪物鎖定，再按攻擊。<br>怪物會追擊；點攻擊鍵可停止。方向移動會取消自動攻擊。</small></div><div id="log"></div><script>
const cv=document.querySelector('#world'),ctx=cv.getContext('2d'),W=960,H=1100,player={x:470,y:550,hp:300,max:300,ac:-40},mobs=[],obstacles=[{x:280,y:260,w:120,h:90},{x:650,y:680,w:120,h:110},{x:180,y:740,w:100,h:80}];let selected=null,autoAttack=false,goal=null,dir=null,last=performance.now(),swing=0,potionAt=0,stock=30,attacks=0,hits=0,damageTaken=0,kills=0;const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),log=t=>{let el=document.querySelector('#log');el.innerHTML='<div>'+new Date().toLocaleTimeString('zh-TW',{hour12:false})+' '+t+'</div>'+el.innerHTML;el.innerHTML=el.innerHTML.slice(0,7000)};function spawn(type,x,y){let og=type==='歐吉';mobs.push({type,x,y,hp:og?500:28,max:og?500:28,lv:og?28:3,str:og?20:8,ac:og?-18:5,speed:og?43:57,range:og?42:35,attackGap:og?1900:1500,next:performance.now()+rnd(400,1300),dead:false})}function init(){mobs.length=0;spawn('哥布林',350,490);spawn('哥布林',610,470);spawn('哥布林',400,800);spawn('歐吉',720,370);spawn('歐吉',720,840);Object.assign(player,{x:470,y:550,hp:300});selected=null;autoAttack=false;goal=null;stock=30;attacks=hits=damageTaken=kills=0;updateButton();log('重置：騎士 Lv30 HP300，AC -40；歐吉普通傷害採簡化候選公式。')}function solid(x,y){return x<25||y<25||x>W-25||y>H-25||obstacles.some(o=>x>o.x-15&&x<o.x+o.w+15&&y>o.y-15&&y<o.y+o.h+15)}function move(o,dx,dy){if(!solid(o.x+dx,o.y))o.x+=dx;if(!solid(o.x,o.y+dy))o.y+=dy}function toward(o,p,step){let dx=p.x-o.x,dy=p.y-o.y,d=Math.hypot(dx,dy);if(d>2)move(o,dx/d*step,dy/d*step)}function updateButton(){document.querySelector('#attack').textContent='⚔️ 自動攻擊：'+(autoAttack?'開':'關');document.querySelector('#attack').classList.toggle('selected',autoAttack)}function potion(now,manual){if(player.hp<=0||stock<=0||now-potionAt<1400)return false;potionAt=now;stock--;let heal=rnd(35,55);player.hp=Math.min(300,player.hp+heal);log((manual?'手動':'自動')+'紅水 +'+heal+' HP，剩 '+stock);return true}function update(now,dt){if(player.hp<=0){autoAttack=false;updateButton();return}if(document.querySelector('#auto').checked&&player.hp<=300*Number(document.querySelector('#threshold').value)/100)potion(now,false);if(dir){autoAttack=false;goal=null;updateButton();move(player,dir[0]*dt*.19,dir[1]*dt*.19)}else if(autoAttack&&selected&&!selected.dead){if(dist(player,selected)>52)toward(player,selected,dt*.17);else if(now>swing){swing=now+820;let chance=clamp(.55+(30-selected.lv)*.012, .12,.95);let hit=Math.random()<chance;log(hit?'騎士命中 '+selected.type+' '+(rnd(6,16)+rnd(1,8))+' 傷害':'騎士攻擊 MISS');if(hit){let dmg=rnd(6,16)+rnd(1,8);selected.hp-=dmg;if(selected.hp<=0){selected.dead=true;kills++;log(selected.type+' 倒下');selected=null;autoAttack=false;updateButton()}}}}else if(goal){toward(player,goal,dt*.18);if(dist(player,goal)<9)goal=null}for(let m of mobs){if(m.dead)continue;if(dist(m,player)>m.range+2){if(dist(m,player)<320)toward(m,player,dt*m.speed/1000)}else if(now>=m.next){m.next=now+m.attackGap;attacks++;let hit=Math.random()<clamp(.55+(m.lv-30)*.01+player.ac*.005,.05,.95);if(hit){hits++;let raw=rnd(0,m.lv-1)+Math.floor(m.str/2)+1;let red=rnd(0,Math.floor((10-player.ac)/2));let dmg=Math.max(0,raw-red);player.hp=Math.max(0,player.hp-dmg);damageTaken+=dmg;log(m.type+' 命中：原傷 '+raw+'／AC減傷 '+red+'／實傷 '+dmg);if(player.hp===0){log('騎士死亡，按重置再測');autoAttack=false;updateButton()}}else log(m.type+' 攻擊 MISS')}}}function draw(){let w=cv.clientWidth,h=cv.clientHeight,dpr=window.devicePixelRatio||1;if(cv.width!==Math.round(w*dpr)||cv.height!==Math.round(h*dpr)){cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr)}ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);let scale=Math.min(w/420,h/650),camX=player.x-w/(2*scale),camY=player.y-h/(2*scale);ctx.save();ctx.scale(scale,scale);ctx.translate(-camX,-camY);ctx.fillStyle='#354c36';ctx.fillRect(0,0,W,H);ctx.strokeStyle='#496044';ctx.lineWidth=1;for(let x=0;x<W;x+=40)for(let y=0;y<H;y+=40)ctx.strokeRect(x,y,40,40);for(let o of obstacles){ctx.fillStyle='#687268';ctx.fillRect(o.x,o.y,o.w,o.h);ctx.strokeStyle='#b6bca9';ctx.strokeRect(o.x,o.y,o.w,o.h)}for(let m of mobs){if(m.dead)continue;ctx.fillStyle=m.type==='歐吉'?'#b68b58':'#88a96a';ctx.beginPath();ctx.arc(m.x,m.y,m.type==='歐吉'?22:15,0,Math.PI*2);ctx.fill();if(m===selected){ctx.strokeStyle='#f6d56c';ctx.lineWidth=3;ctx.stroke()}ctx.fillStyle='#fff';ctx.font='13px sans-serif';ctx.textAlign='center';ctx.fillText(m.type,m.x,m.y-27);ctx.fillStyle='#281b1b';ctx.fillRect(m.x-25,m.y-23,50,5);ctx.fillStyle='#d64d45';ctx.fillRect(m.x-25,m.y-23,50*Math.max(0,m.hp/m.max),5)}ctx.fillStyle='#4d90d2';ctx.beginPath();ctx.arc(player.x,player.y,16,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#d9ecff';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle='#fff';ctx.font='13px sans-serif';ctx.textAlign='center';ctx.fillText('騎士 Lv30',player.x,player.y-24);ctx.restore();document.querySelector('#hp').textContent='HP '+player.hp+'/300｜紅水 '+stock;document.querySelector('#info').textContent='AC '+player.ac+'｜怪物攻擊 '+attacks+'／命中 '+hits+'（'+(attacks?Math.round(hits/attacks*100):0)+'%）｜承傷 '+damageTaken+'｜擊殺 '+kills;document.querySelector('#target').textContent='目標：'+(selected&&!selected.dead?selected.type+' '+Math.max(0,selected.hp)+' HP':'無')}function loop(now){let dt=Math.min(now-last,70);last=now;update(now,dt);draw();requestAnimationFrame(loop)}cv.addEventListener('pointerdown',e=>{if(player.hp<=0)return;let r=cv.getBoundingClientRect(),scale=Math.min(r.width/420,r.height/650),x=player.x+(e.clientX-r.left-r.width/2)/scale,y=player.y+(e.clientY-r.top-r.height/2)/scale;let m=mobs.filter(m=>!m.dead&&Math.hypot(m.x-x,m.y-y)<33).sort((a,b)=>dist(a,{x,y})-dist(b,{x,y}))[0];if(m){if(m!==selected){selected=m;autoAttack=false;updateButton()}log('鎖定 '+m.type)}else{autoAttack=false;updateButton();goal={x:clamp(x,25,W-25),y:clamp(y,25,H-25)}}});document.querySelector('#attack').onclick=()=>{if(!selected||selected.dead){log('請先點選怪物');return}autoAttack=!autoAttack;goal=null;updateButton()};document.querySelector('#pot').onclick=()=>potion(performance.now(),true);document.querySelector('#ac').onchange=e=>{player.ac=Number(e.target.value);log('AC 改為 '+player.ac)};document.querySelector('#threshold').oninput=e=>document.querySelector('#pct').textContent=e.target.value+'%';document.querySelector('#reset').onclick=()=>{player.ac=Number(document.querySelector('#ac').value);init()};document.querySelectorAll('[data-dir]').forEach(b=>{let d=b.dataset.dir.split(',').map(Number);b.addEventListener('pointerdown',e=>{e.preventDefault();dir=d;b.setPointerCapture(e.pointerId)});for(let ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>dir=null)});window.addEventListener('keydown',e=>{let ds={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]};if(ds[e.key]){dir=ds[e.key];e.preventDefault()}});window.addEventListener('keyup',()=>dir=null);init();requestAnimationFrame(loop);
</script></html>
