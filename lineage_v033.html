(()=>{'use strict';const c=document.getElementById('game'),ctx=c.getContext('2d');let W,H,dpr=1,scale=2,viewW,viewH;const map={w:1800,h:1500};const $=id=>document.getElementById(id);let player,monsters,particles,obstacles,decor,selected=null,goal=null,cam={x:0,y:0},last=0,clock=0,kills=0,gameOver=false,messageUntil=0,autoAttack=false,stock=30,potionCool=0,attacks=0,hits=0,taken=0,chaseStuck=0;const ri=(a,b)=>Math.floor(rnd(a,b+1));const joy={x:0,y:0,pid:null};const rnd=(a,b)=>a+Math.random()*(b-a),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));function resize(){W=Math.max(1,Math.round(document.documentElement.clientWidth));H=Math.max(1,Math.round(window.visualViewport?.height||innerHeight));dpr=Math.min(devicePixelRatio||1,2);c.width=Math.round(W*dpr);c.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);ctx.imageSmoothingEnabled=false;viewW=W;viewH=H}addEventListener('resize',resize);window.visualViewport?.addEventListener('resize',resize);resize();

function blocked(x,y,r,entity=null){if(x<r||y<r||x>map.w-r||y>map.h-r)return true;return obstacles.some(o=>Math.hypot(x-o.x,y-o.y)<r+o.r*.73)||(entity===player?monsters.some(m=>!m.dead&&Math.hypot(x-m.x,y-m.y)<r+m.r+2):entity&&entity!==player&&Math.hypot(x-player.x,y-player.y)<r+player.r+2)}function move(e,vx,vy,dt){let nx=e.x+vx*dt,ny=e.y+vy*dt;if(!blocked(nx,e.y,e.r,e))e.x=nx;if(!blocked(e.x,ny,e.r,e))e.y=ny}function navigate(e,target,speed,dt){let d=dist(e,target);if(d<1)return;let a=Math.atan2(target.y-e.y,target.x-e.x),step=speed*dt,ox=e.x,oy=e.y;let offsets=[0,.35,-.35,.7,-.7,1.05,-1.05,1.5,-1.5,2.1,-2.1,Math.PI];let best=null,bestScore=-Infinity;for(let offset of offsets){let angle=a+offset,dx=Math.cos(angle),dy=Math.sin(angle),nx=e.x+dx*step,ny=e.y+dy*step;if(blocked(nx,ny,e.r,e))continue;let score=Math.cos(offset)*3;if(e.navAngle!==undefined)score+=Math.cos(angle-e.navAngle)*1.5;if(e.navSide&&offset!==0)score+=Math.sign(offset)===e.navSide?.65:0;if(score>bestScore){bestScore=score;best={dx,dy,angle,offset}}}if(best){move(e,best.dx*speed,best.dy*speed,dt);if(Math.hypot(e.x-ox,e.y-oy)>.01){e.navAngle=best.angle;if(Math.abs(best.offset)>.2)e.navSide=Math.sign(best.offset);return}}e.navAngle=undefined}

// L1J Classic L1Attack.java: d20 對抗 AC，1 必失、20 必命中；騎士 baseHit 暫用測試設定，非完整裝備/技能公式。\nfunction strike(){if(gameOver||player.cool>0)return;let t=selected&&!selected.dead?selected:null;if(!t){say('請先點擊怪物鎖定',.65);return}if(dist(player,t)>player.r+t.r+33)return;player.cool=.82;player.swing=.26;player.face=Math.atan2(t.y-player.y,t.x-player.x);let baseHit=30+Math.floor(30/3)+2;let roll=ri(1,20),attackDice=roll+baseHit-10,defenseDice=10-t.ac;let hit=roll===20||(roll!==1&&attackDice>defenseDice);if(!hit){particles.push({x:t.x,y:t.y-26,text:'MISS',life:.65,color:'#eeeeee'});return}let raw=ri(6,16)+ri(1,8),dmg=Math.max(1,raw-ri(0,Math.max(0,Math.floor((10-t.ac)/3))));t.hp-=dmg;t.hurt=.19;t.active=true;particles.push({x:t.x,y:t.y-26,text:'-'+dmg,life:.65,color:'#ffe19a'});if(t.hp<=0){t.dead=true;kills++;particles.push({x:t.x,y:t.y-40,text:'+1 擊殺',life:1.1,color:'#f3d177'});selected=null;autoAttack=false;setAttackLabel()}updateUI()}

else if(autoAttack&&selected&&!selected.dead){let t=selected,d=dist(player,t);if(d>player.r+t.r+33){let ox=player.x,oy=player.y;let dx=(t.x-player.x)/d,dy=(t.y-player.y)/d;player.face=Math.atan2(dy,dx);navigate(player,t,player.speed,dt);if(Math.hypot(player.x-ox,player.y-oy)<.03)chaseStuck+=dt;else chaseStuck=0;if(chaseStuck>1.5){autoAttack=false;setAttackLabel();say('追擊受阻，已停止',1)}}else{chaseStuck=0;strike()}}

function draw(){rect(0,0,W,H,'#416044');ctx.save();ctx.translate(-Math.round(cam.x),-Math.round(cam.y));let sx=Math.floor(cam.x/48)*48,sy=Math.floor(cam.y/48)*48;for(let y=sy;y<cam.y+H+48;y+=48)for(let x=sx;x<cam.x+W+48;x+=48){rect(x,y,48,48,((Math.floor(x/48)*17+Math.floor(y/48)*7)&1)?'#466748':'#426344');rect(x+7,y+13,4,3,'#52714d');rect(x+33,y+37,5,3,'#36593d')}for(const d of decor){if(d.x<cam.x-20||d.x>cam.x+W+20||d.y<cam.y-20||d.y>cam.y+H+20)continue;rect(d.x,d.y,5,3,d.kind===0?'#c3af69':d.kind===1?'#658751':'#36573b')}for(const o of obstacles){if(o.x<cam.x-50||o.x>cam.x+W+50||o.y<cam.y-50||o.y>cam.y+H+50)continue;if(o.type==='rock'){rect(o.x-19,o.y-10,38,25,'#59655c');rect(o.x-15,o.y-15,27,15,'#89928a');rect(o.x-9,o.y-12,14,5,'#a4aca2')}else{rect(o.x-5,o.y,11,21,'#544831');rect(o.x-25,o.y-24,49,35,'#244f32');rect(o.x-18,o.y-38,37,35,'#326840');rect(o.x-11,o.y-43,24,20,'#3e7546')}}if(goal){ctx.strokeStyle='#e9d18b';ctx.lineWidth=2;ctx.strokeRect(goal.x-7,goal.y-7,14,14)}for(const m of monsters){if(m.dead)continue;if(selected===m){ctx.strokeStyle='#f9dd75';ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(m.x,m.y+8,24,14,0,0,Math.PI*2);ctx.stroke()}drawEntity(m.x,m.y,m.aggro?'goblin':'ogre',m.hurt);rect(m.x-18,m.y-39,36,5,'#522a28');rect(m.x-18,m.y-39,36*m.hp/m.max,5,m.aggro?'#d95c4b':'#83c7db')}drawEntity(player.x,player.y,'hero',player.hurt,player.face);if(player.swing>0){ctx.strokeStyle='#ffe9aa';ctx.lineWidth=5;ctx.beginPath();ctx.arc(player.x,player.y,35,player.face-.9,player.face+.9);ctx.stroke()}for(const p of particles){ctx.globalAlpha=Math.min(1,p.life*2);ctx.fillStyle=p.color;ctx.font='bold 16px monospace';ctx.textAlign='center';ctx.fillText(p.text,p.x,p.y);ctx.globalAlpha=1}ctx.restore()}
let pointerStart=null;c.addEventListener('pointerdown',e=>{if(gameOver)return;pointerStart={x:e.clientX,y:e.clientY};});c.addEventListener('pointerup',e=>{if(!pointerStart)return;const start=pointerStart;pointerStart=null;if(gameOver||Math.hypot(e.clientX-start.x,e.clientY-start.y)>15)return;const bounds=c.getBoundingClientRect();const x=(e.clientX-bounds.left)*W/bounds.width+cam.x,y=(e.clientY-bounds.top)*H/bounds.height+cam.y;let best=null,bestD=48;for(const m of monsters){if(m.dead)continue;let d=Math.hypot(x-m.x,y-m.y);if(d<bestD){best=m;bestD=d}}if(best){if(selected!==best){autoAttack=false;setAttackLabel()}selected=best;goal=null}else{autoAttack=false;setAttackLabel();goal={x,y}}updateUI()});c.addEventListener('pointercancel',()=>{pointerStart=null});const stick=$('stick'),knob=$('knob');function setJoy(e){let b=stick.getBoundingClientRect(),dx=e.clientX-(b.left+b.width/2),dy=e.clientY-(b.top+b.height/2),d=Math.hypot(dx,dy),r=(b.width-48)/2,fac=d>r?r/d:1;dx*=fac;dy*=fac;joy.x=dx/r;joy.y=dy/r;knob.style.transform=`translate(${dx}px,${dy}px)`}stick.addEventListener('pointerdown',e=>{autoAttack=false;setAttackLabel();joy.pid=e.pointerId;stick.setPointerCapture(e.pointerId);setJoy(e)});stick.addEventListener('pointermove',e=>{if(joy.pid===e.pointerId)setJoy(e)});function clearJoy(e){if(joy.pid!==e.pointerId)return;joy.pid=null;joy.x=joy.y=0;knob.style.transform='translate(0,0)'}stick.addEventListener('pointerup',clearJoy);stick.addEventListener('pointercancel',clearJoy);$('attack').addEventListener('pointerdown',e=>{e.preventDefault();if(!selected||selected.dead){say('請先點擊怪物鎖定',.7);return}autoAttack=!autoAttack;goal=null;chaseStuck=0;setAttackLabel()});$('potion').addEventListener('pointerdown',e=>{e.preventDefault();usePotion()});$('ac').addEventListener('change',e=>{player.ac=Number(e.target.value);updateUI()});$('potpct').addEventListener('input',e=>$('pctlabel').textContent=e.target.value+'%');$('unlock').addEventListener('click',()=>{selected=null;autoAttack=false;setAttackLabel();updateUI()});$('reset').addEventListener('click',init);addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();if(selected&&!selected.dead){autoAttack=!autoAttack;setAttackLabel()}}if(e.code==='Escape'){selected=null;autoAttack=false;setAttackLabel();updateUI()}});let keys=new Set();addEventListener('keydown',e=>keys.add(e.key.toLowerCase()));addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));function frame(t){let dt=Math.min((t-last)/1000||0,.04);last=t;if(joy.pid===null){let x=Number(keys.has('d')||keys.has('arrowright'))-Number(keys.has('a')||keys.has('arrowleft')),y=Number(keys.has('s')||keys.has('arrowdown'))-Number(keys.has('w')||keys.has('arrowup'));let mag=Math.hypot(x,y);joy.x=mag?x/mag:0;joy.y=mag?y/mag:0}update(dt);draw();requestAnimationFrame(frame)}init();requestAnimationFrame(frame);setTimeout(()=>$('tip').style.display='none',8500);
})();
