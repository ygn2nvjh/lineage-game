<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>類天堂 V0.2｜戰鬥原型</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101811;color:#f1e9ce;font-family:system-ui,-apple-system,sans-serif;touch-action:none}#game{display:block;width:100vw;height:100dvh;image-rendering:pixelated;touch-action:none}.hud{position:fixed;left:12px;top:calc(env(safe-area-inset-top) + 10px);pointer-events:none;text-shadow:1px 2px #111}.name{font-weight:900;font-size:14px;color:#e8d3a0}.bar{width:142px;height:11px;border:2px solid #171b17;background:#3b2020;margin-top:4px}.bar>i{display:block;height:100%;background:#cb5345}.bar.mp{height:8px;background:#172c43}.bar.mp>i{background:#5b8ed4}.info{font-size:11px;margin-top:4px}.righttop{position:fixed;right:12px;top:calc(env(safe-area-inset-top) + 12px);font-size:11px;text-align:right;pointer-events:none;text-shadow:1px 2px #111}.bottom{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 16px);left:0;right:0;display:flex;justify-content:space-between;align-items:end;padding:0 20px;pointer-events:none}.stick{width:124px;height:124px;border:3px solid #b5a88988;border-radius:50%;background:#111e18aa;position:relative;pointer-events:auto;touch-action:none}.knob{position:absolute;left:39px;top:39px;width:42px;height:42px;border-radius:50%;background:#9a9d83cc;border:2px solid #d1c8a2}.actions{display:flex;align-items:end;gap:10px;pointer-events:auto}.btn{border:3px solid #cfb17b;color:#fff5d6;background:#663d2aee;border-radius:50%;width:76px;height:76px;font-weight:900;font-size:17px;touch-action:none;user-select:none}.btn:active{transform:scale(.95);background:#9b5830}.btn.small{width:53px;height:53px;font-size:12px;background:#364b51ee;border-color:#8aa3a5}.tip{position:fixed;top:calc(env(safe-area-inset-top) + 85px);left:50%;transform:translateX(-50%);background:#152218dc;border:1px solid #c1a66e;padding:7px 10px;border-radius:7px;font-size:12px;text-align:center;max-width:78vw;pointer-events:none}.help{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 151px);left:50%;transform:translateX(-50%);font-size:11px;background:#101a13b8;padding:5px 9px;border-radius:5px;white-space:normal;max-width:88vw;text-align:center;pointer-events:none}.reset{position:fixed;right:12px;top:calc(env(safe-area-inset-top) + 57px);padding:5px 8px;background:#25372d;border:1px solid #8d9c79;color:#fff;border-radius:4px;font-size:12px}.target{position:fixed;top:calc(env(safe-area-inset-top) + 65px);left:50%;transform:translateX(-50%);text-align:center;font-size:12px;pointer-events:none;white-space:nowrap}.target b{color:#ffe4a2}#msg{position:fixed;left:50%;top:34%;transform:translateX(-50%);font-size:21px;color:#ffd68a;font-weight:900;text-shadow:2px 2px #000;pointer-events:none;text-align:center;white-space:pre-line;max-width:90vw;overflow-wrap:anywhere}.hide{display:none}@media(max-width:370px){.bottom{padding:0 12px}.stick{width:108px;height:108px}.knob{left:33px;top:33px;width:38px;height:38px}.btn{width:68px;height:68px}}
</style></head><body><canvas id="game"></canvas><div class="hud"><div class="name">Lv.1　見習騎士</div><div class="bar"><i id="hp"></i></div><div class="bar mp"><i style="width:100%"></i></div><div class="info" id="stats">HP 100 / 100　擊殺 0</div></div><div class="target" id="target">點擊怪物鎖定目標</div><div class="righttop">森林練習場<br>V0.2 · 測試版</div><button class="reset" id="reset">重新開始</button><div class="tip" id="tip">搖桿移動或點地面尋路 · 點怪鎖定 · 按攻擊揮刀</div><div class="help">紅色怪主動追擊｜藍色怪受攻擊才反擊</div><div class="bottom"><div class="stick" id="stick"><div class="knob" id="knob"></div></div><div class="actions"><button class="btn small" id="unlock">取消<br>鎖定</button><button class="btn" id="attack">⚔<br>攻擊</button></div></div><div id="msg"></div><script>
(()=>{'use strict';const c=document.getElementById('game'),ctx=c.getContext('2d');let W,H,dpr=1,scale=2,viewW,viewH;const map={w:1800,h:1500};const $=id=>document.getElementById(id);let player,monsters,particles,obstacles,decor,selected=null,goal=null,cam={x:0,y:0},last=0,clock=0,kills=0,gameOver=false,messageUntil=0;const joy={x:0,y:0,pid:null};const rnd=(a,b)=>a+Math.random()*(b-a),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));function resize(){W=Math.max(1,Math.round(document.documentElement.clientWidth));H=Math.max(1,Math.round(window.visualViewport?.height||innerHeight));dpr=Math.min(devicePixelRatio||1,2);c.width=Math.round(W*dpr);c.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);ctx.imageSmoothingEnabled=false;viewW=W;viewH=H}addEventListener('resize',resize);window.visualViewport?.addEventListener('resize',resize);resize();
function init(){pointerStart=null;joy.pid=null;joy.x=joy.y=0;$('knob').style.transform='translate(0,0)';messageUntil=0;player={x:map.w/2,y:map.h/2,r:15,hp:100,max:100,speed:160,face:0,swing:0,cool:0,hurt:0};kills=0;gameOver=false;selected=null;goal=null;particles=[];monsters=[];obstacles=[];decor=[];clock=0;for(let i=0;i<75;i++){let x=rnd(45,map.w-45),y=rnd(45,map.h-45);if(Math.hypot(x-player.x,y-player.y)<175)continue;let r=rnd(19,32);obstacles.push({x,y,r,type:i%4===0?'rock':'tree'})}for(let i=0;i<240;i++)decor.push({x:rnd(0,map.w),y:rnd(0,map.h),kind:i%4});for(let i=0;i<19;i++)spawn(i);$('msg').textContent='';$('tip').style.display='block';updateUI()}
function spawn(i){let x,y;for(let k=0;k<100;k++){x=rnd(90,map.w-90);y=rnd(90,map.h-90);if(Math.hypot(x-player.x,y-player.y)>190&&obstacles.every(o=>Math.hypot(x-o.x,y-o.y)>o.r+25))break}const aggro=i%2===0;monsters.push({id:i,x,y,homeX:x,homeY:y,r:14,hp:aggro?65:50,max:aggro?65:50,aggro,active:false,speed:aggro?74:88,attack:0,wander:rnd(0,6),phase:rnd(0,7),hurt:0,dead:false})}
function blocked(x,y,r,entity=null){if(x<r||y<r||x>map.w-r||y>map.h-r)return true;return obstacles.some(o=>Math.hypot(x-o.x,y-o.y)<r+o.r*.73)||(entity===player?monsters.some(m=>!m.dead&&Math.hypot(x-m.x,y-m.y)<r+m.r+2):entity&&entity!==player&&Math.hypot(x-player.x,y-player.y)<r+player.r+2)}function move(e,vx,vy,dt){let nx=e.x+vx*dt,ny=e.y+vy*dt;if(!blocked(nx,e.y,e.r,e))e.x=nx;if(!blocked(e.x,ny,e.r,e))e.y=ny}function say(t,d=1.1){$('msg').textContent=t;messageUntil=clock+d}function updateUI(){$('hp').style.width=(player.hp/player.max*100)+'%';$('stats').textContent=`HP ${Math.ceil(player.hp)} / 100　擊殺 ${kills}`;$('target').innerHTML=selected&&!selected.dead?`鎖定：<b>${selected.aggro?'狂暴哥布林':'森林史萊姆'}</b>　HP ${Math.ceil(selected.hp)}/${selected.max}`:'點擊怪物鎖定目標'}
function strike(){if(gameOver||player.cool>0)return;player.cool=.48;player.swing=.26;let t=selected&&!selected.dead?selected:null;if(!t){say('請先點擊怪物鎖定',.65);return}let d=dist(player,t);player.face=Math.atan2(t.y-player.y,t.x-player.x);if(d>82){say('距離太遠，請靠近怪物',.65);return}t.hp-=20+Math.floor(Math.random()*11);t.hurt=.19;t.active=true;particles.push({x:t.x,y:t.y-26,text:'-'+(t.hp<=0?'KO':Math.ceil(20)),life:.65,color:'#ffe19a'});if(t.hp<=0){t.dead=true;kills++;particles.push({x:t.x,y:t.y-40,text:'+1 擊殺',life:1.1,color:'#f3d177'});selected=null}updateUI()}
function update(dt){clock+=dt;if(clock>messageUntil&&$('msg').textContent)$('msg').textContent='';if(gameOver)return;player.cool=Math.max(0,player.cool-dt);player.swing=Math.max(0,player.swing-dt);player.hurt=Math.max(0,player.hurt-dt);let vx=joy.x,vy=joy.y;if(Math.hypot(vx,vy)>.12){goal=null;player.face=Math.atan2(vy,vx);move(player,vx*player.speed,vy*player.speed,dt)}else if(goal){let dx=goal.x-player.x,dy=goal.y-player.y,d=Math.hypot(dx,dy);if(d<7)goal=null;else{player.face=Math.atan2(dy,dx);let ox=player.x,oy=player.y;move(player,dx/d*player.speed,dy/d*player.speed,dt);if(Math.hypot(player.x-ox,player.y-oy)<.02)goal=null}}for(const m of monsters){if(m.dead)continue;m.hurt=Math.max(0,m.hurt-dt);m.attack-=dt;let d=dist(m,player);if(m.aggro&&d<210)m.active=true;if(m.active&&d>380){m.active=false}if(m.active){if(d>m.r+player.r+7){move(m,(player.x-m.x)/d*m.speed,(player.y-m.y)/d*m.speed,dt)}else if(m.attack<=0){m.attack=1.15;player.hp=Math.max(0,player.hp-(m.aggro?9:6));player.hurt=.25;particles.push({x:player.x,y:player.y-32,text:m.aggro?'-9':'-6',life:.7,color:'#ff9b8e'});updateUI();if(player.hp<=0){gameOver=true;say('角色死亡\n點右上角「重新開始」',999)}}}else{m.wander-=dt;if(m.wander<0){m.wander=rnd(1.5,4);m.phase=rnd(-Math.PI,Math.PI)}if(dist(m,{x:m.homeX,y:m.homeY})<90)move(m,Math.cos(m.phase)*18,Math.sin(m.phase)*18,dt)}}particles=particles.filter(p=>(p.life-=dt)>0);for(const p of particles)p.y-=dt*24;cam.x=clamp(player.x-W/2,0,Math.max(0,map.w-W));cam.y=clamp(player.y-H/2,0,Math.max(0,map.h-H))}
function rect(x,y,w,h,color){ctx.fillStyle=color;ctx.fillRect(Math.round(x),Math.round(y),Math.ceil(w),Math.ceil(h))}function drawEntity(x,y,type,hurt=0,face=0){ctx.save();ctx.translate(Math.round(x),Math.round(y));rect(-14,11,28,7,'#26392b');if(type==='hero'){rect(-9,7,7,12,'#393d4c');rect(3,7,7,12,'#393d4c');rect(-12,-14,24,27,hurt?'#fff1d8':'#9da6aa');rect(-8,-12,16,17,'#647789');rect(-10,-30,20,18,'#b3bbc0');rect(-7,-26,14,6,'#394c56');rect(-16,-10,6,18,'#777e89');rect(10,-10,6,18,'#777e89');ctx.save();ctx.rotate(face);rect(12,-4,20,5,'#dce2d7');rect(14,-8,5,13,'#d1ac64');ctx.restore()}else if(type==='goblin'){rect(-11,3,8,13,'#68563a');rect(3,3,8,13,'#68563a');rect(-13,-16,26,23,hurt?'#fff1d8':'#9e5348');rect(-11,-27,22,17,'#729450');rect(-16,-22,8,7,'#729450');rect(8,-22,8,7,'#729450');rect(-7,-20,5,4,'#fff1ad');rect(3,-20,5,4,'#fff1ad');rect(12,-6,13,4,'#b8a585')}else{rect(-15,-3,30,17,hurt?'#fff1d8':'#74a9b2');rect(-12,-17,24,17,hurt?'#fff1d8':'#92d0d5');rect(-6,-10,4,4,'#273c49');rect(4,-10,4,4,'#273c49');rect(-9,11,18,3,'#4c7884')}ctx.restore()}
function draw(){rect(0,0,W,H,'#416044');ctx.save();ctx.translate(-Math.round(cam.x),-Math.round(cam.y));let sx=Math.floor(cam.x/48)*48,sy=Math.floor(cam.y/48)*48;for(let y=sy;y<cam.y+H+48;y+=48)for(let x=sx;x<cam.x+W+48;x+=48){rect(x,y,48,48,((Math.floor(x/48)*17+Math.floor(y/48)*7)&1)?'#466748':'#426344');rect(x+7,y+13,4,3,'#52714d');rect(x+33,y+37,5,3,'#36593d')}for(const d of decor){if(d.x<cam.x-20||d.x>cam.x+W+20||d.y<cam.y-20||d.y>cam.y+H+20)continue;rect(d.x,d.y,5,3,d.kind===0?'#c3af69':d.kind===1?'#658751':'#36573b')}for(const o of obstacles){if(o.x<cam.x-50||o.x>cam.x+W+50||o.y<cam.y-50||o.y>cam.y+H+50)continue;if(o.type==='rock'){rect(o.x-19,o.y-10,38,25,'#59655c');rect(o.x-15,o.y-15,27,15,'#89928a');rect(o.x-9,o.y-12,14,5,'#a4aca2')}else{rect(o.x-5,o.y,11,21,'#544831');rect(o.x-25,o.y-24,49,35,'#244f32');rect(o.x-18,o.y-38,37,35,'#326840');rect(o.x-11,o.y-43,24,20,'#3e7546')}}if(goal){ctx.strokeStyle='#e9d18b';ctx.lineWidth=2;ctx.strokeRect(goal.x-7,goal.y-7,14,14)}for(const m of monsters){if(m.dead)continue;if(selected===m){ctx.strokeStyle='#f9dd75';ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(m.x,m.y+8,24,14,0,0,Math.PI*2);ctx.stroke()}drawEntity(m.x,m.y,m.aggro?'goblin':'slime',m.hurt);rect(m.x-18,m.y-39,36,5,'#522a28');rect(m.x-18,m.y-39,36*m.hp/m.max,5,m.aggro?'#d95c4b':'#83c7db')}drawEntity(player.x,player.y,'hero',player.hurt,player.face);if(player.swing>0){ctx.strokeStyle='#ffe9aa';ctx.lineWidth=5;ctx.beginPath();ctx.arc(player.x,player.y,35,player.face-.9,player.face+.9);ctx.stroke()}for(const p of particles){ctx.globalAlpha=Math.min(1,p.life*2);ctx.fillStyle=p.color;ctx.font='bold 16px monospace';ctx.textAlign='center';ctx.fillText(p.text,p.x,p.y);ctx.globalAlpha=1}ctx.restore()}
let pointerStart=null;c.addEventListener('pointerdown',e=>{if(gameOver)return;pointerStart={x:e.clientX,y:e.clientY};});c.addEventListener('pointerup',e=>{if(!pointerStart)return;const start=pointerStart;pointerStart=null;if(gameOver||Math.hypot(e.clientX-start.x,e.clientY-start.y)>15)return;const bounds=c.getBoundingClientRect();const x=(e.clientX-bounds.left)*W/bounds.width+cam.x,y=(e.clientY-bounds.top)*H/bounds.height+cam.y;let best=null,bestD=48;for(const m of monsters){if(m.dead)continue;let d=Math.hypot(x-m.x,y-m.y);if(d<bestD){best=m;bestD=d}}if(best){selected=best;goal=null}else{selected=null;goal={x,y}}updateUI()});c.addEventListener('pointercancel',()=>{pointerStart=null});const stick=$('stick'),knob=$('knob');function setJoy(e){let b=stick.getBoundingClientRect(),dx=e.clientX-(b.left+b.width/2),dy=e.clientY-(b.top+b.height/2),d=Math.hypot(dx,dy),r=(b.width-48)/2,fac=d>r?r/d:1;dx*=fac;dy*=fac;joy.x=dx/r;joy.y=dy/r;knob.style.transform=`translate(${dx}px,${dy}px)`}stick.addEventListener('pointerdown',e=>{joy.pid=e.pointerId;stick.setPointerCapture(e.pointerId);setJoy(e)});stick.addEventListener('pointermove',e=>{if(joy.pid===e.pointerId)setJoy(e)});function clearJoy(e){if(joy.pid!==e.pointerId)return;joy.pid=null;joy.x=joy.y=0;knob.style.transform='translate(0,0)'}stick.addEventListener('pointerup',clearJoy);stick.addEventListener('pointercancel',clearJoy);$('attack').addEventListener('pointerdown',e=>{e.preventDefault();strike()});$('unlock').addEventListener('click',()=>{selected=null;updateUI()});$('reset').addEventListener('click',init);addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();strike()}if(e.code==='Escape'){selected=null;updateUI()}});let keys=new Set();addEventListener('keydown',e=>keys.add(e.key.toLowerCase()));addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));function frame(t){let dt=Math.min((t-last)/1000||0,.04);last=t;if(joy.pid===null){let x=Number(keys.has('d')||keys.has('arrowright'))-Number(keys.has('a')||keys.has('arrowleft')),y=Number(keys.has('s')||keys.has('arrowdown'))-Number(keys.has('w')||keys.has('arrowup'));let mag=Math.hypot(x,y);joy.x=mag?x/mag:0;joy.y=mag?y/mag:0}update(dt);draw();requestAnimationFrame(frame)}init();requestAnimationFrame(frame);setTimeout(()=>$('tip').style.display='none',8500);
})();
</script></body></html>
