haracter.baseMaxHp;player.hp=player.max;updateUI()};function renderChar(){const p=$('charbody');p.innerHTML=(window.lineageRenderAttributes?window.lineageRenderAttributes():'<h3>人物／裝備</h3>')+'<p>當前 HP '+Math.ceil(player.hp)+' / '+player.max+'　AC '+player.ac+'　擊殺 '+kills+'</p><div class="grid">'+gear().map(x=>'<div>'+x+'</div>').join('')+'</div>'}function renderBag(){const items=['紅水 ×'+stock,'短劍',...Object.entries(lootBag).map(([id,v])=>v.name+' ×'+v.count+' (#'+id+')')];$('bagbody').innerHTML='<h3>背包</h3><div class="grid">'+items.map(x=>'<div>'+x+'</div>').join('')+'</div>'}$('charbtn').addEventListener('click',()=>{renderChar();toggle('charpanel')});$('bagbtn').addEventListener('click',()=>{renderBag();toggle('bagpanel')});$('mapbtn').addEventListener('click',()=>{$('mapbody').innerHTML='<h3>古魯丁野外｜選擇測試區域</h3><p>目前：'+(village?'古魯丁村莊':ZONE_NAMES[fieldZone])+'</p><p>各區使用核對的 L1J-TW 3.80c 怪物、HP、AC、EXP 及原始掉落表。地形及戰鬥 AI 仍為原型。</p>'+ZONE_NAMES.map((n,i)=>'<p><button class="zoneChoice" data-zone="'+i+'">前往 '+n+'</button></p>').join('')+'<p>已取得金幣：'+adenaEarned+'</p>';$('mapbody').querySelectorAll('.zoneChoice').forEach(b=>b.onclick=()=>changeFieldZone(+b.dataset.zone));toggle('mappanel')});document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',()=>$(b.dataset.close).hidden=true));
})();
</script><script>
(function(){
const base=[16,12,14,8,9,12], labels=['STR 力量','DEX 敏捷','CON 體質','INT 智力','WIS 精神','CHA 魅力'];
let pts=[0,0,0,0,0,0];let ready=false;
const $=id=>document.getElementById(id);
function mrWis(w){if(w<=14)return 0;if(w<=16)return 3;if(w===17)return 6;if(w===18)return 10;if(w===19)return 15;if(w===20)return 21;return 0}
function render(){
const used=pts.reduce((a,b)=>a+b,0);$('createRemain').textContent=4-used;
$('createStats').innerHTML=base.map((v,i)=>'<div class="statRow"><span>'+labels[i]+'</span><button data-idx="'+i+'" data-dir="-1" '+(pts[i]===0?'disabled':'')+'>−</button><strong>'+(v+pts[i])+'</strong><button data-idx="'+i+'" data-dir="1" '+(used===4?'disabled':'')+'>+</button></div>').join('');
$('createStats').querySelectorAll('button').forEach(b=>b.onclick=()=>{const i=+b.dataset.idx,d=+b.dataset.dir;if(d<0&&pts[i]>0||d>0&&used<4){pts[i]+=d;render()}});
const con=14+pts[2],wis=9+pts[4],bonus=con>=17?3:con>=15?1:0,lo=17+Math.max(0,con-15)+bonus;
const originalMr=wis>=12?2:wis>=10?1:0;
$('createPreview').textContent='初始 HP 16 / MP '+(wis>=12?2:1)+' ｜每級 HP 約 '+lo+'～'+(lo+1)+' ｜Lv.1 MR '+(mrWis(wis)+originalMr)+'（未含裝備）';
$('createConfirm').disabled=used!==4;
}
$('createConfirm').onclick=()=>{
const name=$('createName').value.trim();if(!name){$('createError').textContent='請輸入角色名稱';return}
const stats=Object.fromEntries(['str','dex','con','int','wis','cha'].map((k,i)=>[k,base[i]+pts[i]]));
const data={name,sex:$('createSex').value,stats,level:1,baseMaxHp:16,baseMaxMp:stats.wis>=12?2:1,exp:0,coins:100,lossRecords:[],createdAt:Date.now()};
try{localStorage.setItem('lineage_v048_character',JSON.stringify(data))}catch(e){$('createError').textContent='瀏覽器儲存失敗，本次仍可試玩'}
window.lineageCharacter=data;ready=true;$('createOverlay').style.display='none';updateHud();window.lineageSyncGame?.();};
function updateHud(){
const d=window.lineageCharacter;if(!d)return;
const name=document.querySelector('.hud .name');if(name)name.textContent='Lv.'+d.level+'　'+d.name+'・騎士';
}
window.lineageRenderAttributes=function(){
const d=window.lineageCharacter;if(!d)return '';
const x=d.stats,originalMr=x.wis>=12?2:x.wis>=10?1:0;
return '<h3>'+d.name+'・騎士 Lv.'+d.level+'</h3><p>經驗 '+(d.exp||0).toLocaleString()+'　金幣 '+(d.coins||0).toLocaleString()+'</p><p>STR '+x.str+'　DEX '+x.dex+'　CON '+x.con+'</p><p>INT '+x.int+'　WIS '+x.wis+'　CHA '+x.cha+'</p><p>初始 HP '+d.baseMaxHp+'　MP '+d.baseMaxMp+'　MR '+(mrWis(x.wis)+originalMr)+'</p><p style="font-size:11px;color:#c7bda5">目前角色 HP 已接入戰鬥；命中及傷害仍使用舊版測試公式。</p>';
};
try{const old=JSON.parse(localStorage.getItem('lineage_v045_character')||'null');if(old&&old.stats&&old.name){window.lineageCharacter=old;old.exp??=0;old.coins??=100;old.lossRecords??=[];ready=true;$('createOverlay').style.display='none';updateHud();}}catch(e){}
$('resetCharacter').onclick=()=>{if(!confirm('確定刪除目前的測試角色，重新進行創角？此操作只會清除 V0.4.5 的本機創角資料。'))return;try{localStorage.removeItem('lineage_v045_character')}catch(e){}window.lineageCharacter=null;pts=[0,0,0,0,0,0];$('createName').value='';$('createSex').value='male';$('createError').textContent='';render();$('createOverlay').style.display='block';};

// 騎士成長：L1J-TW 3.80c CalcStat.calcStatHp/Mp；上限由該版本設定檔提供。
function levelKnight(){
const d=window.lineageCharacter;if(!d||d.level>=99)return;
const con=d.stats.con,wis=d.stats.wis;
const originalHpup=con>=17?3:con>=15?1:0;
let hp=17+Math.floor(Math.random()*2)+Math.max(0,con-15);
hp=Math.min(hp,Math.max(0,2000-d.baseMaxHp));
hp+=originalHpup;
const seedY=wis===9||wis>=12&&wis<=17?3:2;
const seedZ=wis>=10&&wis<=14?1:wis>=15&&wis<=20?2:0;
let mp=Math.floor((Math.floor(Math.random()*seedY)+1+seedZ)*2/3);
mp=Math.min(mp,Math.max(0,600-d.baseMaxMp));
d.baseMaxHp+=Math.max(0,hp);d.baseMaxMp+=Math.max(0,mp);d.level++;
try{localStorage.setItem('lineage_v048_character',JSON.stringify(d))}catch(e){}
window.lineageSyncGame?.();
window.lineageRefreshExp?.();
}
document.getElementById('levelBtn').addEventListener('click',levelKnight);

const EXP_TABLE=[0,125,300,500,750,1296,2401,4096,6581,10000,14661,20756,28581,38436,50645,65556,83541,104996,130341,160020,194501,234276,279861,331792,390641,456992,531457,614672,707297,810016,923537,1048592,1185937,1336352,1500641,1679632,1874177,2085152,2313457,2560016,2825777,3111713,3418818,3748113,4100642,4830002,6338418,9833681,19745870,55810962,91876054,127941146,164006238,200071330,236136422,272201514,308266606,344331698,380396790,416461882,452526974,488592066,524657158,560722250,596787342,632852434,668917526,704982618,741047710,777112802,813177894,849242986,885308078,921373170,957438262,993503354,1029568446,1065633538,1101698630,1137763722,1173828814,1209893906,1245958998,1282024090,1318089182,1354154274,1390219366,1426284458,1462349550,1498414642,1534479734,1570544826,1606609918,1642675010,1678740102,1714805194,1750870286,1786935378,1823000470,1859065562];
function save(){const d=window.lineageCharacter;if(!d)return;try{localStorage.setItem('lineage_v048_character',JSON.stringify(d))}catch(e){}}
function refresh(){const d=window.lineageCharacter;if(!d)return;const start=EXP_TABLE[d.level-1],next=EXP_TABLE[d.level]??start,need=Math.max(1,next-start),progress=Math.max(0,(d.exp||0)-start),pct=d.level>=99?100:Math.min(100,progress/need*100);document.getElementById('xpPct').textContent=pct.toFixed(2)+'%';document.getElementById('xpFill').style.width=pct+'%';document.getElementById('xpDetail').textContent=d.level>=99?'已達最高等級':progress.toLocaleString()+' / '+need.toLocaleString()+'（距升級 '+Math.max(0,need-progress).toLocaleString()+'）';document.getElementById('expGain').textContent='經驗 +10,000｜Lv.'+d.level;document.getElementById('expOpen').textContent='恢復紀錄 '+d.lossRecords.length+'/10';}
window.lineageRefreshExp=refresh;
function addExp(amount){const d=window.lineageCharacter;if(!d)return;d.exp=Math.max(0,(d.exp||0)+amount);while(d.level<99&&d.exp>=EXP_TABLE[d.level]){levelKnight()}save();refresh();}
function death(){const d=window.lineageCharacter;if(!d)return 0;const lv=d.level;if(lv<11)return 0;const need=EXP_TABLE[lv]-EXP_TABLE[lv-1];const rate=lv<45?.1:lv===45?.09:lv===46?.08:lv===47?.07:lv===48?.06:.05;const raw=Math.floor(need*rate);const floor=EXP_TABLE[lv-1];const loss=Math.min(raw,Math.max(0,d.exp-floor));if(loss>0){d.exp-=loss;d.lossRecords.push({id:Date.now()+Math.random(),amount:loss,level:lv,when:new Date().toLocaleString('zh-TW')});while(d.lossRecords.length>10)d.lossRecords.shift();}save();refresh();return loss}
window.lineageDeath=()=>{const lost=death();setTimeout(()=>alert('死亡損失經驗 '+lost.toLocaleString()+'；不降級。\n已儲存恢復紀錄，可先打怪再恢復。'),50)};
function openRestore(){const d=window.lineageCharacter;if(!d)return;const el=document.getElementById('expContent');el.innerHTML='<p>目前金幣：'+d.coins.toLocaleString()+'　累積經驗：'+d.exp.toLocaleString()+'</p>'+(d.lossRecords.length?d.lossRecords.map((r,i)=>'<p>第 '+(i+1)+' 筆｜Lv.'+r.level+'｜損失 '+r.amount.toLocaleString()+' EXP｜費用 '+Math.ceil(r.amount/10000)+' 金幣 <button data-id="'+r.id+'">恢復</button></p>').join(''):'<p>目前沒有可恢復紀錄。</p>')+'<p>測試用金幣初始 100；每 10,000 經驗收 1 金幣，未滿一萬暫以 1 金幣計。</p>';
el.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{const index=d.lossRecords.findIndex(x=>String(x.id)===b.dataset.id);if(index<0)return;const r=d.lossRecords[index],fee=Math.ceil(r.amount/10000);if(d.coins<fee){alert('金幣不足');return}d.coins-=fee;d.lossRecords.splice(index,1);addExp(r.amount);save();openRestore()});document.getElementById('expPanel').hidden=false}
document.getElementById('expGain').onclick=()=>{addExp(10000)};
document.getElementById('expDeath').onclick=()=>{const lost=death();alert('模擬死亡：損失 '+lost+' EXP，不降級。')};
document.getElementById('expOpen').onclick=openRestore;
document.getElementById('expClose').onclick=()=>document.getElementById('expPanel').hidden=true;
refresh();

render();
})();
</script></body></html>
