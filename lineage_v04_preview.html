<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>類天堂 V0.4 視覺原型</title><style>body{margin:0;background:#10150e;color:#e9d8ac;font-family:system-ui}canvas{display:block;width:100vw;height:72dvh;touch-action:none;image-rendering:pixelated}nav{display:flex;flex-wrap:wrap;gap:7px;padding:10px}button{background:#383b2d;border:2px solid #827654;color:#ffe9b5;border-radius:6px;padding:12px}#info{padding:8px;font-size:13px}#panel{position:absolute;top:12%;left:8%;right:8%;background:#20251c;border:3px ridge #aa9361;padding:15px;display:none;max-height:65vh;overflow:auto}.slots{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}.slots span{border:1px solid #85734e;background:#343a2d;padding:9px 0;text-align:center;font-size:12px}</style><canvas id="game" width="360" height="580"></canvas><div id="info">騎士 Lv.1　HP 100/100　MP 20/20　AC 10　｜　古魯丁村莊</div><nav><button onclick="move(0,-1)">↑</button><button onclick="move(-1,0)">←</button><button onclick="move(0,1)">↓</button><button onclick="move(1,0)">→</button><button onclick="toggle('角色')">角色</button><button onclick="toggle('裝備')">裝備</button><button onclick="toggle('背包')">背包</button><button onclick="toggle('地圖')">地圖</button><button onclick="toggle('')">關閉</button></nav><div id="panel"></div><script>const c=document.querySelector('canvas'),g=c.getContext('2d');let x=180,y=360,world=0;const p=document.querySelector('#panel');function move(dx,dy){x=Math.max(15,Math.min(345,x+dx*15));y+=dy*15;if(y<22){world=1;y=540}else if(y>555){world=0;y=35}draw()}function toggle(t){p.style.display=t?'block':'none';p.innerHTML='<h3>'+t+'</h3>'+(t==='角色'?'騎士 Lv.1<br>HP 100/100<br>MP 20/20<br>STR 16　DEX 12　CON 16<br>AC 10':t==='地圖'?'古魯丁村莊 ↔ 古魯丁北方野外（葡萄園、遠古戰場、食屍鬼出沒地）': '<div class="slots">'+Array.from({length:t==='裝備'?12:30},(_,i)=>'<span>'+(t==='裝備'?['頭盔','項鍊','披風','武器','盔甲','盾牌','手套','戒指','戒指','腰帶','長靴','其他'][i]:'□')+'</span>').join('')+'</div>')}function draw(){g.fillStyle=world?'#3a4830':'#65704b';g.fillRect(0,0,360,580);for(let i=0;i<65;i++){let a=(i*73)%360,b=(i*97)%580;g.fillStyle=world?'#566442':'#768159';g.fillRect(a,b,8,4)}if(!world){g.fillStyle='#8b8267';g.fillRect(144,0,70,580);for(let i=0;i<5;i++){let a=i%2?20:250,b=40+i*105;g.fillStyle='#695843';g.fillRect(a,b,95,66);g.fillStyle='#58382b';g.beginPath();g.moveTo(a-9,b);g.lineTo(a+47,b-28);g.lineTo(a+105,b);g.fill()}g.fillStyle='#d8bf77';g.fillText('古魯丁村莊',130,28)}else{for(let i=0;i<22;i++){let a=(i*47)%360,b=(i*83)%580;g.fillStyle=i%3?'#37442a':'#66604d';g.fillRect(a,b,17,20)}g.fillStyle='#e3c98a';g.fillText('北方野外｜葡萄園・遠古戰場・食屍鬼出沒地',18,28)}g.fillStyle='#161a14';g.fillRect(x-9,y-3,18,17);g.fillStyle='#b2b6ae';g.fillRect(x-7,y-16,14,20);g.fillStyle='#d9b18c';g.fillRect(x-5,y-23,10,9);g.fillStyle='#b8a36b';g.fillRect(x+8,y-10,3,24);document.querySelector('#info').textContent='騎士 Lv.1　HP 100/100　MP 20/20　AC 10　｜　'+(world?'古魯丁北方野外':'古魯丁村莊')}draw();let sx,sy;c.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY});c.addEventListener('pointerup',e=>{if(sx===undefined)return;let dx=e.clientX-sx,dy=e.clientY-sy;if(Math.abs(dx)>Math.abs(dy))move(Math.sign(dx),0);else move(0,Math.sign(dy));sx=undefined});</script></html>
