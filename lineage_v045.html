</style></head><body><div id="createOverlay"><div id="createBox"><h2>⚔ 創建騎士</h2><p>依 L1J-TW 3.80c 基礎能力值，分配全部 4 點後建立角色。</p><label>角色名稱<input id="createName" maxlength="12" placeholder="輸入角色名稱"></label><label>角色性別<select id="createSex"><option value="male">男性</option><option value="female">女性</option></select></label><h3>剩餘點數：<span id="createRemain">4</span> / 4</h3><div id="createStats"></div><p id="createPreview"></p><p id="createError"></p><button id="createConfirm" disabled>確認創角・進入遊戲</button><p>本版僅為單機瀏覽器測試，角色資料暫存在此瀏覽器；尚未接入多人伺服器。</p></div></div><canvas id="game"></canvas><div class="hud"><div class="name">Lv.30　騎士</div><div class="bar"><i id="hp"></i></div><div class="bar mp"><i style="width:100%"></i></div><div class="info" id="stats">HP 300 / 300　擊殺 0</div></div><div class="target" id="target">點擊怪物鎖定目標</div><div class="righttop">森林練習場<br>V0.4.5 · V0.3.6 基底</div><button class="reset" id="reset">重新開始</button><div class="tip" id="tip">搖桿移動／點地面 · 點怪鎖定 · 攻擊鍵自動追擊</div><div class="help">哥布林主動追擊｜歐吉受攻擊反擊｜命中骰採 L1J 流程；角色加成仍為測試值</div><div class="bottom"><div class="stick" id="stick"><div class="knob" id="knob"></div></div><div class="actions"><button class="btn small" id="potion">紅水<br>30</button><button class="btn small" id="unlock">取消<br>鎖定</button><button class="btn" id="attack">⚔<br>攻擊</button></div></div><div class="settings" id="settings"><label>AC <select id="ac"><option value="0">0</option><option value="-20">-20</option><option value="-40" selected>-40</option><option value="-60">-60</option></select></label><label><input id="autopot" type="checkbox" checked>自動紅水</label><label>門檻 <input id="potpct" type="range" min="10" max="90" step="10" value="50"><span id="pctlabel">50%</span></label><span id="combatStats"></span></div><div class="menu"><button id="charbtn">人物／裝備</button><button id="bagbtn">背包</button><button id="mapbtn">地圖</button><button id="zonebtn">進村</button></div><section id="charpanel" class="panel side left" hidden><button class="close" data-close="charpanel">✕</button><div id="charbody"></div></section><section id="bagpanel" class="panel side right" hidden><button class="close" data-close="bagpanel">✕</button><div id="bagbody"></div></section><section id="mappanel" class="panel" hidden><button class="close" data-close="mappanel">✕</button><div id="mapbody"></div></section><div id="msg"></div><button id="debugToggle" style="position:fixed;right:12px;top:calc(env(safe-area-inset-top) + 102px);z-index:8;background:#1c3028;color:#e8d5a4;border:1px solid #b6a175;border-radius:5px;padding:5px 9px;font-size:12px">診斷：關</button><pre id="debugPanel" style="display:none;position:fixed;z-index:7;top:calc(env(safe-area-inset-top) + 140px);right:8px;width:min(90vw,350px);max-height:36vh;overflow:auto;background:#0b1715e8;color:#d6edc6;border:1px solid #a4b891;padding:9px;font:11px/1.5 monospace;white-space:pre-wrap;pointer-events:none"></pre><script>
(()=>{'use strict';const c=document.getElementById('game'),ctx=c.getContext('2d');let W,H,dpr=1,scale=2,viewW,viewH;const map={w:1800,h:1500};const $=id=>document.getElementById(id);let player,monsters,particles,obstacles,decor,selected=null,goal=null,cam={x:0,y:0},last=0,clock=0,kills=0,gameOver=false,messageUntil=0,autoAttack=false,stock=30,potionCool=0,attacks=0,hits=0,taken=0,chaseStuck=0;const ri=(a,b)=>Math.floor(rnd(a,b+1));const joy={x:0,y:0,pid:null};const rnd=(a,b)=>a+Math.random()*(b-a),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));function resize(){W=Math.max(1,Math.round(document.documentElement.clientWidth));H=Math.max(1,Math.round(window.visualViewport?.height||innerHeight));dpr=Math.min(devicePixelRatio||1,2);c.width=Math.round(W*dpr);c.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);ctx.imageSmoothingEnabled=false;viewW=W;viewH=H}addEventListener('resize',resize);window.visualViewport?.addEventListener('resize',resize);resize();
function init(){pointerStart=null;joy.pid=null;joy.x=joy.y=0;$('knob').style.transform='translate(0,0)';messageUntil=0;player={x:map.w/2,y:map.h/2,r:15,hp:300,max:300,ac:Number($('ac').value),speed:160,face:0,swing:0,cool:0,hurt:0};kills=0;gameOver=false;selected=null;goal=null;autoAttack=false;stock=30;potionCool=0;attacks=0;hits=0;taken=0;chaseStuck=0;setAttackLabel();particles=[];monsters=[];obstacles=[];decor=[];clock=0;for(let i=0;i<75;i++){let x=rnd(45,map.w-45),y=rnd(45,map.h-45);if(Math.hypot(x-player.x,y-player.y)<175)continue;let r=rnd(19,32);obstacles.push({x,y,r,type:i%4===0?'rock':'tree'})}for(let i=0;i<240;i++)decor.push({x:rnd(0,map.w),y:rnd(0,map.h),kind:i%4});for(let i=0;i<19;i++)spawn(i);$('msg').textContent='';$('tip').style.display='block';updateUI()}
function spawn(i){let x,y;for(let k=0;k<100;k++){x=rnd(90,map.w-90);y=rnd(90,map.h-90);if(Math.hypot(x-player.x,y-player.y)>190&&obstacles.every(o=>Math.hypot(x-o.x,y-o.y)>o.r+25))break}const aggro=i%2===0;monsters.push({id:i,x,y,homeX:x,homeY:y,r:aggro?14:19,hp:aggro?28:500,max:aggro?28:500,lv:aggro?3:28,str:aggro?8:20,ac:aggro?5:-18,aggro,active:false,speed:aggro?74:60,attack:0,windup:0,windupTarget:false,wander:rnd(0,6),phase:rnd(0,7),hurt:0,dead:false})}
function blocked(x,y,r,entity=null){if(x<r||y<r||x>map.w-r||y>map.h-r)return true;return obstacles.some(o=>Math.hypot(x-o.x,y-o.y)<r+o.r*.73)||(entity===player?monsters.some(m=>!m.dead&&Math.hypot(x-m.x,y-m.y)<r+m.r+2):entity&&entity!==player&&Math.hypot(x-player.x,y-player.y)<r+player.r+2)}function move(e,vx,vy,dt){let nx=e.x+vx*dt,ny=e.y+vy*dt;if(!blocked(nx,e.y,e.r,e))e.x=nx;if(!blocked(e.x,ny,e.r,e))e.y=ny}function navigate(e,target,speed,dt){let d=dist(e,target);if(d<1)return;let a=Math.atan2(target.y-e.y,target.x-e.x),step=speed*dt,ox=e.x,oy=e.y;let offsets=[0,.35,-.35,.7,-.7,1.05,-1.05,1.5,-1.5,2.1,-2.1,Math.PI];let best=null,bestScore=-Infinity;for(let offset of offsets){let angle=a+offset,dx=Math.cos(angle),dy=Math.sin(angle),nx=e.x+dx*step,ny=e.y+dy*step;if(blocked(nx,ny,e.r,e))continue;let score=Math.cos(offset)*3;if(e.navAngle!==undefined)score+=Math.cos(angle-e.navAngle)*1.5;if(e.navSide&&offset!==0)score+=Math.sign(offset)===e.navSide?.65:0;if(score>bestScore){bestScore=score;best={dx,dy,angle,offset}}}if(best){move(e,best.dx*speed,best.dy*speed,dt);if(Math.hypot(e.x-ox,e.y-oy)>.01){e.navAngle=best.angle;if(Math.abs(best.offset)>.2)e.navSide=Math.sign(best.offset);return}}e.navAngle=undefined}
function say(t,d=1.1){$('msg').textContent=t;messageUntil=clock+d}function setAttackLabel(){$('attack').innerHTML=autoAttack?'⚔<br>停止':'⚔<br>攻擊';$('attack').style.borderColor=autoAttack?'#88e0a0':'#cfb17b'}
let debugOn=false,debugLast=0,debugEvent='尚無事件',debugAttacks=0,debugHits=0;function logCombat(t){debugEvent=t}function updateDebug(){if(!debugOn||clock-debugLast<.15)return;debugLast=clock;let alive=monsters.filter(m=>!m.dead),active=alive.filter(m=>m.active);let target=selected&&!selected.dead?selected:null;let text='【角色】 Lv30 騎士\nHP '+Math.ceil(player.hp)+'/'+player.max+'　AC '+player.ac+'\n位置 '+Math.round(player.x)+','+Math.round(player.y)+'　移速 '+player.speed+'\n攻擊CD '+player.cool.toFixed(2)+'s　自動追擊 '+(autoAttack?'開':'關')+'\n紅水 '+stock+'　藥水CD '+potionCool.toFixed(2)+'s\n\n【怪物】 存活 '+alive.length+' / '+monsters.length+'　警戒 '+active.length+'\n';if(target)text+='鎖定 '+(target.aggro?'哥布林':'歐吉')+' #'+target.id+' Lv'+target.lv+'\nHP '+Math.ceil(target.hp)+'/'+target.max+' AC '+target.ac+'\n距離 '+Math.round(dist(player,target))+'　AI '+(target.active?'追擊/戰鬥':'閒置')+'\n';else text+='鎖定 無\n';text+='\n【戰鬥】\n怪物命中 '+hits+'/'+attacks+'　玩家攻擊 '+debugHits+'/'+debugAttacks+'\n最近事件 '+debugEvent+'\n\n註：單機測試版；尚無多人伺服器狀態。';$('debugPanel').textContent=text}function updateUI(){$('hp').style.width=(player.hp/player.max*100)+'%';$('stats').textContent='HP '+Math.ceil(player.hp)+' / '+player.max+'　擊殺 '+kills+'　紅水 '+stock;$('potion').innerHTML='紅水<br>'+stock;$('combatStats').textContent='AC '+player.ac+'｜怪物命中 '+hits+'/'+attacks+' ('+(attacks?Math.round(hits/attacks*100)+'%':'尚無攻擊')+')｜累計承傷 '+taken;$('target').innerHTML=selected&&!selected.dead?'鎖定：<b>'+(selected.aggro?'哥布林':'歐吉')+'</b>　HP '+Math.ceil(selected.hp)+'/'+selected.max:'點擊怪物鎖定目標'}
function usePotion(){if(gameOver||stock<=0||potionCool>0)return false;stock--;potionCool=1.4;let heal=ri(35,55);player.hp=Math.min(player.max,player.hp+heal);particles.push({x:player.x,y:player.y-35,text:'+'+heal,life:.8,color:'#89f6a0'});updateUI();return true}
// L1J Classic L1Attack.java: d20 對抗 AC，1 必失、20 必命中；騎士 baseHit 暫用測試設定，非完整裝備/技能公式。
function strike(){if(gameOver||player.cool>0)return;let t=selected&&!selected.dead?selected:null;if(!t){say('請先點擊怪物鎖定',.65);return}if(dist(player,t)>player.r+t.r+33)return;player.cool=.82;player.swing=.26;player.face=Math.atan2(t.y-player.y,t.x-player.x);debugAttacks++;let baseHit=30+Math.floor(30/3)+2;let roll=ri(1,20),attackDice=roll+baseHit-10,defenseDice=10-t.ac;let hit=roll===20||(roll!==1&&attackDice>defenseDice);if(!hit){logCombat('玩家攻擊 '+(t.aggro?'哥布林':'歐吉')+'：MISS / d20='+roll);particles.push({x:t.x,y:t.y-26,text:'MISS',life:.65,color:'#eeeeee'});return}let raw=ri(6,16)+ri(1,8),dmg=Math.max(1,raw-ri(0,Math.max(0,Math.floor((10-t.ac)/3))));debugHits++;logCombat('玩家命中 '+(t.aggro?'哥布林':'歐吉')+'：'+dmg+' / d20='+roll);t.hp-=dmg;t.hurt=.19;t.active=true;particles.push({x:t.x,y:t.y-26,text:'-'+dmg,life:.65,color:'#ffe19a'});if(t.hp<=0){t.dead=true;kills++;particles.push({x:t.x,y:t.y-40,text:'+1 擊殺',life:1.1,color:'#f3d177'});selected=null;autoAttack=false;setAttackLabel()}updateUI()}
function update(dt){clock+=dt;if(clock>messageUntil&&$('msg').textContent)$('msg').textContent='';if(gameOver)return;player.cool=Math.max(0,player.cool-dt);player.swing=Math.max(0,player.swing-dt);player.hurt=Math.max(0,player.hurt-dt);potionCool=Math.max(0,potionCool-dt);
let vx=joy.x,vy=joy.y;
if(Math.hypot(vx,vy)>.12){if(autoAttack){autoAttack=false;setAttackLabel()}goal=null;player.face=Math.atan2(vy,vx);move(player,vx*player.speed,vy*player.speed,dt)}
else if(autoAttack&&selected&&!selected.dead){let t=selected,d=dist(player,t);if(d>player.r+t.r+33){let ox=player.x,oy=player.y;let dx=(t.x-player.x)/d,dy=(t.y-player.y)/d;player.face=Math.atan2(dy,dx);navigate(player,t,player.speed,dt);if(Math.hypot(player.x-ox,player.y-oy)<.03)chaseStuck+=dt;else chaseStuck=0;if(chaseStuck>1.5){autoAttack=false;setAttackLabel();say('追擊受阻，已停止',1)}}else{chaseStuck=0;strike()}}
else if(goal){let dx=goal.x-player.x,dy=goal.y-player.y,d=Math.hypot(dx,dy);if(d<7)goal=null;else{player.face=Math.atan2(dy,dx);let ox=player.x,oy=player.y;navigate(player,goal,player.speed,dt);if(Math.hypot(player.x-ox,player.y-oy)<.02)goal=null}}
for(const m of monsters){if(m.dead)continue;m.hurt=Math.max(0,m.hurt-dt);let d=dist(m,player);if(m.aggro&&d<260)m.active=true;if(m.active&&d>380)m.active=false;
