async function loadWeaponDatabase(){try{const r=await fetch('./data/weapons.json',{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const d=await r.json();if(!Array.isArray(d.weapons)||d.weapons.length<2)throw Error('武器資料不足');const previous=TEST_WEAPON.id;TEST_WEAPONS=d.weapons.map(w=>({id:w.id,name:w.name,small:w.small,large:w.large,hit:w.hit,bonus:w.bonus,enchant:0,material:w.material,canBreak:w.canbedmg===1,bless:w.bless,durability:0}));TEST_WEAPON=TEST_WEAPONS.find(w=>w.id===previous)||TEST_WEAPONS[1];console.info('武器 JSON 已載入',TEST_WEAPONS.length)}catch(e){console.warn('武器資料使用內建備援',e.message)}}

async function loadMonsterDatabase(){try{const r=await fetch('./data/monsters.json',{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const d=await r.json();if(!Array.isArray(d.monsters)||d.monsters.length<14)throw Error('怪物數量不足');const zones={'遠古戰場':0,'葡萄園':1,'食屍鬼出沒地':2};const rows=d.monsters.map(m=>{if(!Number.isInteger(m.npcId)||typeof m.name!=='string'||!Number.isFinite(m.hp)||m.hp<=0||!(m.zone in zones))throw Error('資料格式錯誤 '+m.npcId);return [m.npcId,m.name,m.level,m.hp,m.mp,m.ac,m.exp,zones[m.zone]]});if(new Set(rows.map(m=>m[0])).size!==rows.length)throw Error('怪物 ID 重複');L1J_ROSTER=rows;NPC_SOURCE_BY_ID=Object.fromEntries(d.monsters.map(m=>[m.npcId,{...(m.originalTaiwan||{}),...(m.originalL1J||{})}]));NPC_TEST_PROFILES=Object.fromEntries(d.monsters.filter(m=>m.combat&&m.combat.size!==null).map(m=>[m.npcId,{size:m.combat.size,undead:m.combat.undead,dr:m.combat.damageReduction??0}]));MONSTER_DB_STATUS='JSON 已載入 '+rows.length+' 隻';console.info(MONSTER_DB_STATUS)}catch(e){MONSTER_DB_STATUS='資料庫讀取失敗，使用備援：'+e.message;console.warn(MONSTER_DB_STATUS)}}

// V0.5.44 isolated deterministic vineyard terrain. The other original zones retain their original logic.
const VINE_T=30,VINE_W=60,VINE_H=50,VINE_SOLID=new Uint8Array(VINE_W*VINE_H);
const vineIndex=(x,y)=>y*VINE_W+x;
const vineNoise=(x,y,s=0)=>{let n=Math.imul(x+113,374761393)^Math.imul(y+67,668265263)^Math.imul(s+17,1274126177);n=Math.imul(n^(n>>>13),1274126177);return ((n^(n>>>16))>>>0)/4294967296};
function vineRoadX(y){return Math.round(34+2.4*Math.sin(y/7)+1.1*Math.sin(y/3))}
function vineWestY(x){return Math.round(35+2*Math.sin(x/7))}
function vineEastY(x){return Math.round(30+2*Math.sin(x/6))}
function vinePath(x,y){return Math.abs(x-vineRoadX(y))<=2||(x<=35&&Math.abs(y-vineWestY(x))<=1)||(x>=34&&Math.abs(y-vineEastY(x))<=1)||(y>=18&&y<=20&&x>=28&&x<=37)}
function vineHouse(x,y){return x>=22&&x<=29&&y>=12&&y<=19}
function vineHouseDoor(x,y){return x===29&&y===18}
function vineKind(x,y){if(vinePath(x,y))return 2;if(vineHouse(x,y))return vineHouseDoor(x,y)?9:8;const n=vineNoise(x,y);if(x<19&&y<19)return n<.14?3:n<.18?4:0;if(x<24&&y>=19&&y<43)return x%5===0&&n<.88?5:0;if(x>42&&y<18)return n<.065?4:1;if(x>40&&y>=18)return n<.18?6:1;return n<.13?1:0}
function buildVineyard(){VINE_SOLID.fill(0);obstacles=[];decor=[];monsters=[];for(let y=0;y<VINE_H;y++)for(let x=0;x<VINE_W;x++){const k=vineKind(x,y);if(k===3||k===4||k===5||k===8)VINE_SOLID[vineIndex(x,y)]=1}player.x=vineRoadX(44)*VINE_T+15;player.y=44*VINE_T+15;selected=null;goal=null;autoAttack=false;setAttackLabel();spawnVineyardApproved()}
function vineyardBlocked(x,y,r){const hitR=Math.min(r,10);if(x-hitR<0||y-hitR<0||x+hitR>=map.w||y+hitR>=map.h)return true;const minX=Math.max(0,Math.floor((x-hitR)/VINE_T)),maxX=Math.min(VINE_W-1,Math.floor((x+hitR)/VINE_T)),minY=Math.max(0,Math.floor((y-hitR)/VINE_T)),maxY=Math.min(VINE_H-1,Math.floor((y+hitR)/VINE_T));for(let ty=minY;ty<=maxY;ty++)for(let tx=minX;tx<=maxX;tx++){if(!VINE_SOLID[vineIndex(tx,ty)])continue;const nearX=Math.max(tx*VINE_T,Math.min(x,(tx+1)*VINE_T)),nearY=Math.max(ty*VINE_T,Math.min(y,(ty+1)*VINE_T));if((x-nearX)**2+(y-nearY)**2<hitR*hitR)return true}return false}

$('bagbody').addEventListener('click',e=>{const b=e.target.closest('.bagQuickAssign');if(!b)return;const i=Number(b.dataset.slot);quickBindings[i]=b.dataset.item==='white'?'white':'potion';try{localStorage.setItem('lineage_quick_v0513',JSON.stringify(quickBindings))}catch(err){}updateQuickButtons();say((quickBindings[i]==='white'?'白水':'紅水')+'已設定快捷 '+(i+1),1.7);renderBag()});
$('charbtn').addEventListener('click',()=>{renderChar();toggle('charpanel')});$('bagbtn').addEventListener('click',()=>{renderBag();toggle('bagpanel')});$('mapbtn').addEventListener('click',()=>{$('mapbody').innerHTML='<h3>古魯丁野外｜選擇測試區域</h3><p>目前：'+(village?'古魯丁村莊':ZONE_NAMES[fieldZone])+'</p><p>各區使用核對的 L1J-TW 3.80c 怪物、HP、AC、EXP 及原始掉落表。測試訓練場限定骷髏、骷髏弓箭手、歐吉各4隻，死亡10秒後重生；其他野外地圖不變。</p>'+ZONE_NAMES.map((n,i)=>'<p><button class="zoneChoice" data-zone="'+i+'">前往 '+n+'</button></p>').join('')+'<p>已取得金幣：'+adenaEarned+'</p>';$('mapbody').querySelectorAll('.zoneChoice').forEach(b=>b.onclick=()=>changeFieldZone(+b.dataset.zone));toggle('mappanel')});document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',()=>$(b.dataset.close).hidden=true));

(function(){
const base=[16,12,14,8,9,12], labels=['STR 力量','DEX 敏捷','CON 體質','INT 智力','WIS 精神','CHA 魅力'];

$('createStats').querySelectorAll('button').forEach(b=>b.onclick=()=>{const i=+b.dataset.idx,d=+b.dataset.dir;if(d<0&&pts[i]>0||d>0&&used<4){pts[i]+=d;render()}});
const con=14+pts[2],wis=9+pts[4],bonus=con>=17?3:con>=15?1:0,lo=17+Math.max(0,con-15)+bonus;
const originalMr=wis>=12?2:wis>=10?1:0;
$('createPreview').textContent='初始 HP 16 / MP '+(wis>=12?2:1)+' ｜每級 HP 約 '+lo+'～'+(lo+1)+' ｜Lv.1 MR '+(mrWis(wis)+originalMr)+'（未含裝備）';
$('createConfirm').disabled=used!==4;
}
$('createConfirm').onclick=()=>{
const name=$('createName').value.trim();if(!name){$('createError').textContent='請輸入角色名稱';return}
const stats=Object.fromEntries(['str','dex','con','int','wis','cha'].map((k,i)=>[k,base[i]+pts[i]]));
const data={name,sex:$('createSex').value,stats,originalStats:{...stats},level:1,baseMaxHp:16,baseMaxMp:stats.wis>=12?2:1,exp:0,coins:100,lossRecords:[],createdAt:Date.now()};
try{localStorage.setItem('lineage_v048_character',JSON.stringify(data))}catch(e){$('createError').textContent='瀏覽器儲存失敗，本次仍可試玩'}
window.lineageCharacter=data;ready=true;$('createOverlay').style.display='none';updateHud();window.lineageSyncGame?.();};

const d=window.lineageCharacter;if(!d)return;
const name=document.querySelector('.hud .name');if(name)name.textContent='Lv.'+d.level+'　'+d.name+'・騎士';
}

};

// 騎士成長：L1J-TW 3.80c CalcStat.calcStatHp/Mp；上限由該版本設定檔提供。
function levelKnight(){
const d=window.lineageCharacter;if(!d||d.level>=99)return;
const con=d.stats.con,wis=d.stats.wis;
const originalHpup=con>=17?3:con>=15?1:0;

const seedY=wis===9||wis>=12&&wis<=17?3:2;
const seedZ=wis>=10&&wis<=14?1:wis>=15&&wis<=20?2:0;
let mp=Math.floor((Math.floor(Math.random()*seedY)+1+seedZ)*2/3);

d.baseMaxHp+=Math.max(0,hp);d.baseMaxMp+=Math.max(0,mp);d.level++;

}
document.getElementById('levelBtn').addEventListener('click',()=>{const d=window.lineageCharacter;if(!d||d.level>=99)return;const next=EXP_TABLE[d.level];if(Number.isFinite(next))d.exp=Math.max(Number(d.exp)||0,next);reconcileExp();save();refresh();});

const EXP_TABLE=[0,125,300,500,750,1296,2401,4096,6581,10000,14661,20756,28581,38436,50645,65556,83541,104996,130341,160020,194501,234276,279861,331792,390641,456992,531457,614672,707297,810016,923537,1048592,1185937,1336352,1500641,1679632,1874177,2085152,2313457,2560016,2825777,3111713,3418818,3748113,4100642,4830002,6338418,9833681,19745870,55810962,91876054,127941146,164006238,200071330,236136422,272201514,308266606,344331698,380396790,416461882,452526974,488592066,524657158,560722250,596787342,632852434,668917526,704982618,741047710,777112802,813177894,849242986,885308078,921373170,957438262,993503354,1029568446,1065633538,1101698630,1137763722,1173828814,1209893906,1245958998,1282024090,1318089182,1354154274,1390219366,1426284458,1462349550,1498414642,1534479734,1570544826,1606609918,1642675010,1678740102,1714805194,1750870286,1786935378,1823000470,1859065562];

function save(){const d=window.lineageCharacter;if(!d)return;try{localStorage.setItem('lineage_v048_character',JSON.stringify(d))}catch(e){}}

function reconcileExp(){const d=window.lineageCharacter;if(!d)return;d.level=Math.max(1,Math.min(99,Math.floor(Number(d.level)||1)));d.exp=Math.max(0,Number(d.exp)||0);const floor=EXP_TABLE[d.level-1]||0;if(d.exp<floor)d.exp=floor;while(d.level<99&&d.exp>=EXP_TABLE[d.level])levelKnight();}
function refresh(){const d=window.lineageCharacter;if(!d)return;const start=EXP_TABLE[d.level-1]||0,next=EXP_TABLE[d.level]??start,need=Math.max(1,next-start),progress=Math.max(0,Math.min(need,(d.exp||0)-start)),pct=d.level>=99?100:Math.min(100,progress/need*100);document.getElementById('xpPct').textContent=pct.toFixed(4)+'%';document.getElementById('xpFill').style.width=pct+'%';document.getElementById('expGain').textContent='經驗 +10,000｜Lv.'+d.level;document.getElementById('expOpen').textContent='恢復紀錄 '+d.lossRecords.length+'/10';}

function addExp(amount){const d=window.lineageCharacter;if(!d)return;d.exp=Math.max(0,(Number(d.exp)||0)+Math.max(0,Number(amount)||0));reconcileExp();save();refresh();}
window.lineageAddExp=addExp;
function death(){const d=window.lineageCharacter;if(!d)return 0;const lv=d.level;if(lv<11)return 0;const need=EXP_TABLE[lv]-EXP_TABLE[lv-1];const rate=lv<45?.1:lv===45?.09:lv===46?.08:lv===47?.07:lv===48?.06:.05;const raw=Math.floor(need*rate);const floor=EXP_TABLE[lv-1];const loss=Math.min(raw,Math.max(0,d.exp-floor));if(loss>0){d.exp-=loss;d.lossRecords.push({id:Date.now()+Math.random(),amount:loss,level:lv,when:new Date().toLocaleString('zh-TW')});while(d.lossRecords.length>10)d.lossRecords.shift();}save();refresh();return loss}
window.lineageDeath=()=>{const lost=death();setTimeout(()=>alert('死亡損失經驗 '+lost.toLocaleString()+'；不降級。\n已儲存恢復紀錄，可先打怪再恢復。'),50)};
function openRestore(){const d=window.lineageCharacter;if(!d)return;const el=document.getElementById('expContent');el.innerHTML='<p>目前金幣：'+d.coins.toLocaleString()+'　累積經驗：'+d.exp.toLocaleString()+'</p>'+(d.lossRecords.length?d.lossRecords.map((r,i)=>'<p>第 '+(i+1)+' 筆｜Lv.'+r.level+'｜損失 '+r.amount.toLocaleString()+' EXP｜費用 '+Math.ceil(r.amount/10000)+' 金幣 <button data-id="'+r.id+'">恢復</button></p>').join(''):'<p>目前沒有可恢復紀錄。</p>')+'<p>測試用金幣初始 100；每 10,000 經驗收 1 金幣，未滿一萬暫以 1 金幣計。</p>';
el.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{const index=d.lossRecords.findIndex(x=>String(x.id)===b.dataset.id);if(index<0)return;const r=d.lossRecords[index],fee=Math.ceil(r.amount/10000);if(d.coins<fee){alert('金幣不足');return}d.coins-=fee;d.lossRecords.splice(index,1);addExp(r.amount);save();openRestore()});document.getElementById('expPanel').hidden=false}

reconcileExp();save();refresh();
