<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>女騎士・背面八幀步行試播</title><style>*{box-sizing:border-box}body{margin:0;background:#14241b;color:#eddfc4;font:15px/1.7 system-ui}main{max-width:960px;margin:auto;padding:14px 12px}h1{font-size:23px}h2{font-size:18px}p{font-size:14px}a{color:#eccc90}.note{background:#263c2b;border-left:3px solid #b8a568;padding:10px}.row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}button,a.button{font:inherit;padding:9px 12px;color:#ecd19a;background:#294331;border:1px solid #a99863;border-radius:7px;text-decoration:none}button[aria-pressed=true]{background:#755f33}.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{min-width:0;border:1px solid #617252;border-radius:8px;padding:10px}canvas{display:block;width:100%;background:#20392a;image-rendering:pixelated}.scroll{overflow:auto}#strip{width:1024px;height:170px}input{max-width:120px}label{display:flex;align-items:center;gap:6px}@media(max-width:650px){.pair{grid-template-columns:1fr}}</style><main><h1>紅髮女騎士・背面八幀步行試播</h1><p class="note">保留原F1／F3／F5／F7，補入F2／F4／F6／F8。八張已齊，造型與動態仍待驗收；原地循環不代表實際前進已接地。</p><div class="row"><button id="pause">暫停</button><button id="prev">上一幀</button><button id="next">下一幀</button><button id="slow" aria-pressed="false">半速</button><button id="seam">接縫慢播一次</button><button id="zoom" aria-pressed="false">完整角色2倍</button><button id="reset">重置</button></div><div id="frames" class="row"></div><div class="row"><button data-mode="full" aria-pressed="true">完整角色</button><button data-mode="upper" aria-pressed="false">背甲與髮根</button><button data-mode="legs" aria-pressed="false">雙腿與腳掌</button><button data-mode="equipment" aria-pressed="false">完整劍盾</button></div><p id="status"></p><div class="pair"><section class="card"><h2>背面靜態母版</h2><canvas id="master" width="400" height="280"></canvas></section><section class="card"><h2>背面八幀・原地循環</h2><canvas id="candidate" width="400" height="280"></canvas></section></div><h2>實際向上前進・接地測試</h2><p>地面格線隨向上前進向下捲動。看支撐腳是否跟地面滑動；投影步幅可調，先測試，不改正式遊戲速度。</p><div class="row"><button data-ground="dirt" aria-pressed="true">道路</button><button data-ground="grass" aria-pressed="false">草地</button><label>投影步幅<input id="stride" type="range" min="8" max="48" step="2" value="32"><span id="strideValue">32</span>px／輪</label><button id="contacts" aria-pressed="false">支撐腳估計點</button></div><canvas id="scene" width="800" height="320"></canvas><p id="groundNote" class="note"></p><h2>八幀逐張</h2><div class="scroll"><canvas id="strip" width="1024" height="170"></canvas></div><p>F7→F8→F1→F2接縫慢播一次，停在F2。一般播放為F1→F8→F1，沒有往返播放。原四個關鍵姿勢可回舊頁對照。</p><p id="audit" class="note"></p><div class="row"><a class="button" href="/game-assets/characters/red-knight/walk-up-v1/walk.png" download>下載八幀透明圖集</a><a class="button" href="/game-assets/characters/red-knight/walk-up-v1/animation.json" download>動畫定位資料</a><a class="button" href="/game-assets/characters/red-knight/walk-up-v1/audit.json">製作與接地檢查</a></div><p><a href="/art-walk-up-keys.html?v=1">原四個關鍵姿勢</a> · <a href="/character-red-knight.html">人物資料表</a> · <a href="/art-walk-p12.html?v=7">已確認右向</a></p><p id="error" role="alert"></p></main><script type="module">
import{gaitSample,advanceWalk}from'/game-assets/characters/walk-cycle-preview.mjs';
const $=id=>document.getElementById(id),base='/game-assets/characters/';async function image(url){const i=new Image();i.src=url;await i.decode();return i}async function json(url){const r=await fetch(url);if(!r.ok)throw Error(url+':'+r.status);return r.json()}
try{const[m,atlas,master,tiles,audit]=await Promise.all([json(base+'red-knight/walk-up-v1/animation.json'),image(base+'red-knight/walk-up-v1/walk.png'),image(base+'red-knight/v1-0-1/runtime/idle.png'),image(base+'red-knight/walk-right-v4/ground.webp'),json(base+'red-knight/walk-up-v1/audit.json')]);let state={distance:0},stride=32,paused=false,rate=1,zoom=1,mode='full',ground='dirt',contacts=false,stopAt=null,last=performance.now();function ctx(c){const t=c.getContext('2d');t.imageSmoothingEnabled=false;return t}function clear(c){const t=ctx(c);t.fillStyle='#20392a';t.fillRect(0,0,c.width,c.height);return t}function actor(c,im,f,x,y,s){ctx(c).drawImage(im,f*128,0,128,128,Math.round(x-64*s),Math.round(y-112*s),128*s,128*s)}function focus(c,im,f){const t=clear(c);if(mode==='full'){actor(c,im,f,200,236,zoom);t.strokeStyle='#b6a56b';t.beginPath();t.moveTo(135,236.5);t.lineTo(265,236.5);t.stroke()}else{const[x,y,w,h,s]=mode==='upper'?[40,25,47,52,4]:mode==='legs'?[45,73,38,47,5]:[24,43,76,72,3];t.drawImage(im,f*128+x,y,w,h,(400-w*s)/2,(280-h*s)/2,w*s,h*s)}}function render(){const f=gaitSample(state.distance,stride).index;focus($('master'),master,4);focus($('candidate'),atlas,f);const c=$('scene'),w=Math.max(280,Math.floor(c.getBoundingClientRect().width));if(c.width!==w)c.width=w;const t=ctx(c),tile=128*zoom,off=state.distance*zoom;for(let y=(off%tile)-tile;y<c.height;y+=tile)for(let x=0;x<c.width;x+=tile)t.drawImage(tiles,ground==='dirt'?128:0,0,128,128,x,Math.round(y),tile,tile);for(let k=Math.floor((-state.distance-170/zoom)/16)-1;k<(-state.distance+170/zoom)/16+1;k++){const y=210+(k*16+state.distance)*zoom;t.strokeStyle='#c3b37b70';t.beginPath();t.moveTo(0,Math.round(y)+.5);t.lineTo(c.width,Math.round(y)+.5);t.stroke()}t.fillStyle='#0005';t.beginPath();t.ellipse(c.width/2,211,12*zoom,3*zoom,0,0,Math.PI*2);t.fill();actor(c,atlas,f,c.width/2,210,zoom);if(contacts&&m.contactEstimates[f]){const q=m.contactEstimates[f];t.strokeStyle=q.leg==='right'?'#efa15d':'#68cad7';t.beginPath();t.arc(c.width/2+(q.x-64)*zoom,210+(q.y-112)*zoom,3*zoom,0,Math.PI*2);t.stroke()}$('status').textContent='F'+(f+1)+'/8｜'+m.frames[f].pose+'｜'+(paused?'已暫停':rate===.5?'半速':'播放中');$('strideValue').textContent=stride;document.querySelectorAll('[data-frame]').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.frame===f));window.upWalkReview={ready:true,frame:f,paused,rate,zoom,mode,stride,ground,contacts,distance:state.distance,stopAt,frameCount:8};}function select(f){paused=true;stopAt=null;state.distance=((f+8)%8)*stride/8;$('pause').textContent='播放';render()}for(let f=0;f<8;f++){const b=document.createElement('button');b.textContent='F'+(f+1);b.dataset.frame=f;b.onclick=()=>select(f);$('frames').append(b)}$('pause').onclick=()=>{paused=!paused;stopAt=null;last=performance.now();$('pause').textContent=paused?'播放':'暫停';render()};$('prev').onclick=()=>select(gaitSample(state.distance,stride).index-1);$('next').onclick=()=>select(gaitSample(state.distance,stride).index+1);$('slow').onclick=()=>{rate=rate===1?.5:1;$('slow').setAttribute('aria-pressed',rate===.5);render()};$('zoom').onclick=()=>{zoom=zoom===1?2:1;$('zoom').setAttribute('aria-pressed',zoom===2);render()};$('reset').onclick=()=>{paused=false;stopAt=null;state.distance=0;last=performance.now();$('pause').textContent='暫停';render()};$('seam').onclick=()=>{state.distance=6*stride/8;stopAt=9*stride/8;rate=.5;paused=false;last=performance.now();$('pause').textContent='暫停';$('slow').setAttribute('aria-pressed',true);render()};$('stride').oninput=()=>{const phase=state.distance/stride;stride=+$('stride').value;state.distance=phase*stride;if(stopAt!==null)stopAt=9*stride/8;render()};$('contacts').onclick=()=>{contacts=!contacts;$('contacts').setAttribute('aria-pressed',contacts);render()};for(const key of ['mode','ground'])document.querySelectorAll('[data-'+key+']').forEach(b=>b.onclick=()=>{if(key==='mode')mode=b.dataset.mode;else ground=b.dataset.ground;document.querySelectorAll('[data-'+key+']').forEach(x=>x.setAttribute('aria-pressed',x===b));render()});const t=clear($('strip'));for(let f=0;f<8;f++){t.drawImage(atlas,f*128,0,128,128,f*128,0,128,128);t.fillStyle='#ecd29a';t.font='12px sans-serif';t.fillText('F'+(f+1)+(f%2===0?' 原關鍵格':' 新補格'),f*128+22,153)}$('audit').textContent='F1／F3／F5／F7原檔保留，新增四個中間姿勢。完整單劍與原四格保留已檢查；背甲、髮量、步態與接地仍以正常速度驗收。';$('groundNote').textContent=audit.groundReviewNote;render();function tick(now){const dt=Math.max(0,now-last);last=Math.max(now,last);if(!document.hidden)state=advanceWalk(state,dt,{speed:stride/.8,rate,paused});if(stopAt!==null&&state.distance>=stopAt){state.distance=stopAt;stopAt=null;paused=true;$('pause').textContent='播放'}render();requestAnimationFrame(tick)}requestAnimationFrame(tick)}catch(e){$('error').textContent='載入失敗：'+e.message;throw e}
</script></html>
