<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="icon" href="data:,"><title>女騎士・右側步行8幀 v0.1</title><style>*{box-sizing:border-box}body{margin:0;background:#14231b;color:#eadfc5;font:15px/1.65 system-ui}main{max-width:900px;margin:auto;padding:14px 12px}h1{font-size:23px}h2{font-size:18px}p{font-size:13px;color:#c3ccb9}button,a.button{background:#294231;border:1px solid #a79360;border-radius:7px;color:#eed6a0;font:inherit;padding:10px 12px;touch-action:manipulation}a{color:#eed6a0}button[aria-pressed=true]{background:#725f32}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}canvas{display:block;image-rendering:pixelated;width:100%;background:#21382a;border-radius:6px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{min-width:0;padding:10px;border:1px solid #617152;border-radius:8px}.card h2{margin:0 0 8px}.pair canvas{aspect-ratio:1.5}.note{border-left:3px solid #aa965e;padding:8px 12px;background:#21382a}.scroll{overflow:auto;border:1px solid #627153;border-radius:8px}#sheet{width:1024px;height:240px}label{display:flex;gap:8px;align-items:center}input{max-width:150px}#scene{height:270px}#status{font-variant-numeric:tabular-nums}@media(max-width:600px){.pair{grid-template-columns:1fr}.card canvas{max-width:360px;margin:auto}}</style><main><h1>女騎士・右側步行8幀 v0.1</h1><p class="note">以 v1.0.1 右側靜態為造型基準。完整角色逐格生成候選，沒有切腳平移；八向靜態原版保留。技術校準不代表所有裝備細節已通過美術驗收，請以實際顯示大小比較。</p><div class="controls"><button id="pause">暫停</button><button id="prev">上一幀</button><button id="next">下一幀</button><button id="slow" aria-pressed="false">半速</button><button id="zoom" aria-pressed="false">放大2倍</button><button id="marks" aria-pressed="true">地面與支撐點</button><button id="reset">重置</button></div><div id="frameButtons" class="controls"></div><p id="status" aria-live="off"></p><section class="pair"><article class="card"><h2>鎖存靜態母版</h2><canvas id="master" width="360" height="240"></canvas></article><article class="card"><h2>原地循環／逐格</h2><canvas id="loop" width="360" height="240"></canvas></article></section><h2>場景前進測試</h2><p>角色持續向右前進，鏡頭跟隨；地面標記固定於世界。每走64來源像素播完一輪；調速時步頻同步變化。這是獨立美術試場，尚未套用正式遊戲速度。</p><div class="controls"><button data-ground="dirt" aria-pressed="true">道路</button><button data-ground="grass" aria-pressed="false">草地</button><button data-ground="quiet" aria-pressed="false">簡化石板</button><label>速度 <input id="speed" type="range" min="40" max="120" step="10" value="80"><span id="speedValue">80</span></label></div><canvas id="scene" height="270"></canvas><h2>八幀母版校準</h2><p>同畫布、同倍率；細線為地面根點，彩色標點為人工標記的支撐腳接觸位置。支撐腳前四格為右腳，後四格為左腳。可橫向滑動看全部八格。</p><div class="scroll"><canvas id="sheet" width="1024" height="240"></canvas></div><p id="metrics"></p><div class="controls"><a class="button" href="/game-assets/characters/red-knight/walk-right-v1/walk-right.png" download="red-knight-walk-right-eight.png">下載透明圖集</a><a class="button" href="/game-assets/characters/red-knight/walk-right-v1/animation.json" download>下載動畫資料</a><a class="button" href="/game-assets/characters/red-knight/walk-right-v1/calibration.json" download>下載校準紀錄</a></div><p><a href="/character-red-knight.html?v=1.0.1">鎖存角色資產庫</a> · <a href="/play">正式遊戲</a></p><p id="error" role="alert"></p></main><script type="module">
import {gaitSample,advanceWalk} from '/game-assets/characters/walk-cycle-preview.mjs';
const base='/game-assets/characters/red-knight/walk-right-v1/';const $=id=>document.getElementById(id);const image=async url=>{const i=new Image();i.src=url;await i.decode();return i};
try{const [m,a,master,tiles,stone]=await Promise.all([fetch(base+'animation.json').then(r=>{if(!r.ok)throw Error('Animation load failed');return r.json()}),image(base+'walk-right.png'),image(base+'master-right.png'),image(base+'ground.webp'),image(base+'quiet.png')]);let state={distance:0},paused=false,rate=1,zoom=1,marks=true,ground='dirt',speed=80,last=performance.now();const canvases=['master','loop','scene','sheet'].map($);const ctx=c=>{const x=c.getContext('2d');x.imageSmoothingEnabled=false;return x};function clear(c){const x=ctx(c);x.fillStyle='#20392a';x.fillRect(0,0,c.width,c.height);return x}function sprite(c,i,x,y,s=1,isMaster=false){const t=ctx(c);t.drawImage(isMaster?master:a,isMaster?0:i*128,0,128,128,Math.round(x-64*s),Math.round(y-112*s),128*s,128*s)}function baseline(c,x,y,s=1,i=null){if(!marks)return;const t=ctx(c);t.strokeStyle='#9c925c';t.lineWidth=1;t.beginPath();t.moveTo(x-50*s,y+.5);t.lineTo(x+50*s,y+.5);t.stroke();t.fillStyle='#9ed2ce';t.fillRect(Math.round(x)-1,Math.round(y)-1,3,3);if(i!==null){const p=m.supportContacts[i];t.fillStyle=i<4?'#f3d581':'#a8d7ef';t.fillRect(Math.round(x+(p.x-64)*s)-2,Math.round(y+(p.y-112)*s)-2,4,4)}}function render(){const sample=gaitSample(state.distance,m.stridePx),i=sample.index;for(const id of ['master','loop']){const c=$(id);clear(c);sprite(c,i,180,194,zoom,id==='master');baseline(c,180,194,zoom,id==='master'?null:i)}const c=$('scene'),w=Math.max(280,Math.floor(c.getBoundingClientRect().width));if(c.width!==w)c.width=w;const t=ctx(c),s=zoom,offset=state.distance*s,tile=128*s;for(let x=-((offset%tile+tile)%tile);x<c.width;x+=tile)for(let y=0;y<c.height;y+=tile){if(ground==='quiet')t.drawImage(stone,0,0,128,128,Math.round(x),y,tile,tile);else t.drawImage(tiles,ground==='dirt'?128:0,0,128,128,Math.round(x),y,tile,tile)}t.strokeStyle='rgba(235,218,140,.65)';t.fillStyle='#e9dcab';t.font='11px sans-serif';for(let k=Math.floor((state.distance-c.width/2/s)/32)-1;k<(state.distance+c.width/2/s)/32+2;k++){const x=Math.round(c.width/2+(k*32-state.distance)*s);t.beginPath();t.moveTo(x,228);t.lineTo(x,241);t.stroke();t.fillText(k*32,x+3,254)}t.fillStyle='#0005';t.beginPath();t.ellipse(c.width/2,211,14*s,4*s,0,0,Math.PI*2);t.fill();sprite(c,i,c.width/2,210,s);baseline(c,c.width/2,210,s,i);$('status').textContent='第 '+(i+1)+'/8 幀｜'+m.frames[i].pose+'｜支撐：'+(i<4?'右腳':'左腳')+'｜'+(paused?'已暫停':rate===.5?'半速播放':'播放中');document.querySelectorAll('[data-frame]').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.frame===i));$('speedValue').textContent=speed;window.walkReview={ready:true,frame:i,paused,rate,zoom,marks,ground,distance:state.distance,speed,effectiveSpeed:speed*rate,stride:m.stridePx,masterRevision:'1.0.1',frameCount:8};}
function sheet(){const c=$('sheet'),t=clear(c);for(let i=0;i<8;i++){const x=64+i*128;t.save();t.globalAlpha=.22;sprite(c,0,x,164,1,true);t.restore();sprite(c,i,x,164);baseline(c,x,164,1,i);t.fillStyle='#e8d5a1';t.font='12px sans-serif';t.textAlign='center';t.fillText((i+1)+' '+m.frames[i].pose,x,190);t.fillText(i<4?'右腳支撐':'左腳支撐',x,210)}}function select(i){paused=true;state.distance=((i+8)%8)*m.stridePx/8;$('pause').textContent='播放';render()}
for(let i=0;i<8;i++){const b=document.createElement('button');b.textContent=i+1;b.dataset.frame=i;b.onclick=()=>select(i);$('frameButtons').append(b)}$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'播放':'暫停';last=performance.now();render()};$('prev').onclick=()=>select(gaitSample(state.distance,m.stridePx).index-1);$('next').onclick=()=>select(gaitSample(state.distance,m.stridePx).index+1);$('slow').onclick=()=>{rate=rate===1?.5:1;$('slow').setAttribute('aria-pressed',rate===.5);render()};$('zoom').onclick=()=>{zoom=zoom===1?2:1;$('zoom').setAttribute('aria-pressed',zoom===2);render()};$('marks').onclick=()=>{marks=!marks;$('marks').setAttribute('aria-pressed',marks);sheet();render()};$('reset').onclick=()=>{state.distance=0;paused=false;last=performance.now();$('pause').textContent='暫停';render()};$('speed').oninput=()=>{speed=+$('speed').value;render()};document.querySelectorAll('[data-ground]').forEach(b=>b.onclick=()=>{ground=b.dataset.ground;document.querySelectorAll('[data-ground]').forEach(x=>x.setAttribute('aria-pressed',x===b));render()});document.addEventListener('visibilitychange',()=>{last=performance.now()});let heights=m.frames.map(f=>f.visibleBounds[3]-f.visibleBounds[1]);$('metrics').textContent='母版96px；步行可見高度 '+Math.min(...heights)+'–'+Math.max(...heights)+'px（含馬尾與承重起伏）。畫布128×128、根點(64,112)。灰色淡影為母版輪廓，供比對裝備與身形。';sheet();render();function tick(now){const dt=now-last;last=now;if(!document.hidden)state=advanceWalk(state,dt,{speed,rate,paused});render();requestAnimationFrame(tick)}requestAnimationFrame(tick);}catch(e){$('error').textContent='載入失敗，請重新整理：'+e.message;throw e}
</script></html>
